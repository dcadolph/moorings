name: windows

# Build the package, run its Swift suite, and probe the Windows app on Windows. A push to
# windows-parity or a spike/ branch is a read: the job may fail there without failing the run, so
# the work in progress is read from the job's result. A pull request to main that touches windows/
# and a manual dispatch are the gate: the job's result is the run's result.
on:
  push:
    branches: [windows-parity, "spike/**"]
  pull_request:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      sim_repeat:
        description: Run the SIM scenarios this many more times after the gate, each one required.
        type: number
        default: 1

jobs:
  core:
    runs-on: windows-latest
    continue-on-error: ${{ github.event_name == 'push' }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Core tests
        run: swift test -Xswiftc -warnings-as-errors
        working-directory: core

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      # Record the desktop for the whole Probe step, so a failed probe can be watched, not only read.
      # The runner ends a step's processes with the step, so the Probe step starts the recorder
      # itself. The mp4 is fragmented and flushed per frame, so a killed recording still plays.
      - name: Record
        timeout-minutes: 5
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'probes'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $choco = @(choco install ffmpeg --version 7.1.1 -y --no-progress)
          if ($LASTEXITCODE -ne 0) {
            $choco | Select-Object -Last 20 | ForEach-Object { Write-Host "  $_" }
            throw "choco install ffmpeg 7.1.1 exited $LASTEXITCODE"
          }
          $installed = [math]::Round($clock.Elapsed.TotalSeconds, 1)
          Write-Host "  install: $installed s"
          if ($installed -gt 120) { Write-Host "::warning::the ffmpeg install took $installed s, over the 2 minute bound" }
          Write-Host "  $(@(& (Get-Command ffmpeg -ErrorAction Stop).Source -version)[0])"

          @'
          # Start-Recorder starts ffmpeg capturing the desktop at 5 fps into a fragmented mp4, which
          # plays even when the recorder is killed, and returns its pid once the file grows.
          function Start-Recorder([string] $file) {
            $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
            $ffArgs = @('-nostdin', '-hide_banner', '-loglevel', 'error', '-f', 'gdigrab', '-framerate', '5',
              '-draw_mouse', '1', '-i', 'desktop', '-c:v', 'libx264', '-preset', 'ultrafast', '-threads', '1',
              '-pix_fmt', 'yuv420p', '-g', '10', '-flush_packets', '1',
              '-movflags', '+frag_keyframe+empty_moov+default_base_moof', '-y', $file)
            $p = Start-Process -FilePath $ffmpeg -ArgumentList $ffArgs -WindowStyle Hidden -RedirectStandardError "$file.err" -PassThru
            $grown = $false
            for ($i = 0; $i -lt 40 -and -not $grown; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { break }
              $grown = (Test-Path $file) -and (Get-Item $file).Length -gt 1024
            }
            if (-not $grown) { throw "the recorder did not start writing ${file}: $(Get-Content "$file.err" -Raw)" }
            return $p.Id
          }

          # Stop-Recorder kills the recorder and says whether it was still running or already gone.
          function Stop-Recorder([int] $id) {
            $p = Get-Process -Id $id -ErrorAction SilentlyContinue
            if (-not $p) { return 'gone' }
            Stop-Process -Id $id -Force
            $null = $p.WaitForExit(10000)
            return 'running'
          }

          # Test-Video returns the file's length in seconds from ffprobe, or throws with its error.
          function Test-Video([string] $file) {
            $ffprobe = (Get-Command ffprobe -ErrorAction Stop).Source
            $out = @(& $ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 $file 2>&1 | ForEach-Object { "$_" })
            $seconds = 0.0
            if ($LASTEXITCODE -ne 0 -or -not [double]::TryParse($out[-1], [Globalization.NumberStyles]::Float, [Globalization.CultureInfo]::InvariantCulture, [ref] $seconds)) {
              throw "ffprobe could not read ${file}: $($out -join ' ')"
            }
            return $seconds
          }
          '@ | Set-Content (Join-Path $dir 'recorder.ps1')
          Write-Host "  check: ffmpeg is installed and the recorder is ready for the Probe step"

      - name: Probe
        run: |
          . (Join-Path $env:RUNNER_TEMP 'probes\recorder.ps1')
          $recorder = Start-Recorder (Join-Path $env:RUNNER_TEMP 'probes\probes.mp4')
          "$recorder $([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" | Set-Content (Join-Path $env:RUNNER_TEMP 'probes\recorder.txt')
          Write-Host "  recording the desktop to probes.mp4 (pid $recorder)"
          $exe = Join-Path (swift build -Xswiftc -warnings-as-errors --show-bin-path) 'MooringsWin.exe'
          # PowerShell waits for a Windows program and captures its output only through a pipe. Plain
          # $out = & $exe returns at once with no lines and leaves $LASTEXITCODE alone, on every step.
          function Probe([string[]] $probeArgs) {
            $out = @(& $exe @probeArgs | ForEach-Object { $_ })
            if ($LASTEXITCODE -ne 0) { throw "probe $probeArgs exited $LASTEXITCODE" }
            $out | ForEach-Object { Write-Host "  $_" }
            return ,$out
          }
          function Expect($lines, [string] $pattern, [string] $why) {
            if (-not ($lines -match $pattern)) { throw "missing: $why" }
          }

          Write-Host "probe version"
          $v = Probe @('--probe', 'version')
          Expect $v '^dpi: per-monitor-v2$' 'per-monitor-v2 DPI awareness'

          # The subsystem field of the PE header: 2 is a Windows program, 3 a console program.
          function Subsystem([string] $path) {
            $bytes = [IO.File]::ReadAllBytes($path)
            [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 24 + 68)
          }
          Write-Host "exe subsystem"
          $subsystem = Subsystem $exe
          $control = Subsystem "$env:SystemRoot\System32\cmd.exe"
          Write-Host "  MooringsWin.exe $subsystem, cmd.exe $control"
          if ($control -ne 3) { throw "the reader said $control for cmd.exe, a console program" }
          if ($subsystem -ne 2) { throw "MooringsWin.exe has subsystem $subsystem, so Explorer opens a console for it" }

          function ConsoleLines([string] $dir) {
            $file = Join-Path $dir 'console.txt'
            $until = (Get-Date).AddSeconds(10)
            while (-not (Test-Path $file) -and (Get-Date) -lt $until) { Start-Sleep -Milliseconds 200 }
            $lines = if (Test-Path $file) { @(Get-Content $file) } else { @() }
            $lines | ForEach-Object { Write-Host "  $_" }
            ,$lines
          }
          function ExpectAll($lines, [string[]] $want, [string] $why) {
            foreach ($line in $want) {
              if (-not ($lines -contains $line)) { throw "$why, want $line, got $($lines -join ', ')" }
            }
          }

          # The step's pwsh holds a hidden console that Explorer does not, so the start runs from a
          # second pwsh that lets go of its console first. It prints the exit code, or running when the
          # process outlived the wait and was stopped. The arguments travel in the environment, since
          # pwsh -File reads a value starting with -- as a parameter.
          $noConsole = Join-Path $env:RUNNER_TEMP 'no-console.ps1'
          Set-Content -Path $noConsole -Value @'
          param([string] $Exe, [int] $Wait)
          Add-Type -Namespace Win32 -Name Console -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool FreeConsole();'
          $null = [Win32.Console]::FreeConsole()
          $p = if ($env:START_ARGUMENTS) { Start-Process $Exe -ArgumentList $env:START_ARGUMENTS -PassThru } else { Start-Process $Exe -PassThru }
          $null = $p.Handle
          if ($p.WaitForExit($Wait)) { "$($p.ExitCode)" } else { 'running'; Stop-Process -Id $p.Id -Force; $p.WaitForExit() }
          '@
          function NoConsole([string] $arguments, [int] $wait) {
            $env:START_ARGUMENTS = $arguments
            $code = @(& pwsh -NoProfile -File $noConsole -Exe $exe -Wait $wait)
            $env:START_ARGUMENTS = ''
            if ($LASTEXITCODE -ne 0) { throw "the no-console start exited $LASTEXITCODE" }
            $code[-1]
          }

          Write-Host "console: started with no console, the way Explorer starts it"
          $dir = Join-Path $env:RUNNER_TEMP 'console-shell'
          $code = NoConsole "--probe console --report $dir" 30000
          if ($code -ne '0') { throw "the start with no console exited $code" }
          ExpectAll (ConsoleLines $dir) @('window: none', 'stdout: device', 'stderr: device', 'screen stdout: no', 'screen stderr: no') 'started with no console'

          Write-Host "console negative control: the same start without opening the streams"
          $dir = Join-Path $env:RUNNER_TEMP 'console-nostreams'
          $code = NoConsole "--probe console --report $dir --no-streams" 30000
          Write-Host "  exit $code"
          if ($code -eq '0') { throw "the probe wrote to a missing stderr and lived, so this check proves nothing" }

          Write-Host "console: started from a terminal, so its lines reach the screen"
          $dir = Join-Path $env:RUNNER_TEMP 'console-terminal'
          $batch = Join-Path $env:RUNNER_TEMP 'console-terminal.cmd'
          Set-Content -Path $batch -Encoding ascii -Value "@`"$exe`" --probe console --report `"$dir`""
          $p = Start-Process $batch -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "the terminal start hung" }
          ExpectAll (ConsoleLines $dir) @('window: present', 'stdout: device', 'stderr: device', 'screen stdout: yes', 'screen stderr: yes') 'started from a terminal'

          Write-Host "console: captured, as every probe below is"
          $dir = Join-Path $env:RUNNER_TEMP 'console-pipe'
          $out = @(& $exe --probe console --report $dir | ForEach-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "the captured start exited $LASTEXITCODE" }
          ExpectAll (ConsoleLines $dir) @('stdout: pipe') 'captured'
          ExpectAll $out @('console marker line') 'captured'

          # A bad choices file makes the engine log a line on start. The log writes stderr first and the
          # file second, so the line in the file shows the app wrote to stderr and lived.
          function AppStart([string] $name, [string] $arguments) {
            $root = Join-Path $env:RUNNER_TEMP "console-app-$name"
            $choices = Join-Path $root 'Roaming\Moorings'
            New-Item -ItemType Directory -Force -Path $choices | Out-Null
            Set-Content -Path (Join-Path $choices 'choices.json') -Value '{ not json'
            $roaming, $local = $env:APPDATA, $env:LOCALAPPDATA
            $env:APPDATA, $env:LOCALAPPDATA = (Join-Path $root 'Roaming'), (Join-Path $root 'Local')
            $code = NoConsole $arguments 5000
            $env:APPDATA, $env:LOCALAPPDATA = $roaming, $local
            $log = Join-Path $root 'Local\Moorings\moorings.log'
            $lines = if (Test-Path $log) { @(Get-Content $log) } else { @() }
            Write-Host "  ${name}: $code, $($lines.Count) log lines"
            $lines | Select-Object -First 3 | ForEach-Object { Write-Host "    $_" }
            @{ Code = $code; Logged = [bool]($lines -match 'choices fell back') }
          }
          Write-Host "console: the app started with no console logs a line and stays up"
          $run = AppStart 'open' ''
          if ($run.Code -ne 'running' -or -not $run.Logged) { throw "the app did not stay up and log: $($run.Code), logged $($run.Logged)" }
          Write-Host "console negative control: the same start without opening the streams"
          $run = AppStart 'closed' '--no-streams'
          if ($run.Code -eq 'running' -or $run.Logged) { throw "the app logged with no stderr and lived: $($run.Code), logged $($run.Logged)" }
          Write-Host "  check: without the streams the app died at its first log line ($($run.Code))"

          Write-Host "probe update against release records served from the runner"
          $site = Join-Path $env:RUNNER_TEMP 'releases'
          New-Item -ItemType Directory -Path $site | Out-Null
          function Record([string] $tag) {
            $dl = "https://github.com/dcadolph/moorings/releases/download/$tag"
            $assets = @(
              @{ name = "moorings_${tag}_macos_universal.zip"; browser_download_url = "$dl/moorings_${tag}_macos_universal.zip" },
              @{ name = "moorings_${tag}_windows_x64.zip"; browser_download_url = "$dl/moorings_${tag}_windows_x64.zip" },
              @{ name = 'SHA256SUMS'; browser_download_url = "$dl/SHA256SUMS" }
            )
            @{ tag_name = $tag; html_url = "https://github.com/dcadolph/moorings/releases/tag/$tag"; draft = $false; prerelease = $false; assets = $assets } | ConvertTo-Json -Depth 4
          }
          Set-Content -Path (Join-Path $site 'newer.json') -Value (Record 'v9.9.9') -Encoding ascii
          Set-Content -Path (Join-Path $site 'older.json') -Value (Record 'v0.0.1') -Encoding ascii
          $server = Start-Process python -ArgumentList @('-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $site) -PassThru -WindowStyle Hidden
          try {
            $up = $false
            foreach ($i in 1..30) {
              try { $null = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/older.json' -UseBasicParsing -TimeoutSec 2; $up = $true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $up) { throw "the release record server did not start" }
            $u = Probe @('--probe', 'update', '--url', 'http://127.0.0.1:8765/newer.json', '--current', '1.0.0')
            Expect $u '^update 9\.9\.9 available zip moorings_v9\.9\.9_windows_x64\.zip$' 'a newer release offers the Windows zip'
            Expect $u '^menu first: Update available: v9\.9\.9$' 'the tray menu leads with the update'
            Expect $u '^due again: false$' 'no second check right after one'
            $u = Probe @('--probe', 'update', '--url', 'http://127.0.0.1:8765/older.json', '--current', '1.0.0')
            Expect $u '^up to date$' 'an older release is not offered'
            if ($u -match '^update ') { throw "an older release was offered" }
            $u = Probe @('--probe', 'update', '--url', 'http://127.0.0.1:8765/missing.json', '--current', '1.0.0')
            Expect $u '^check failed: server\(status: 404\)$' 'a missing record fails the check'
            Expect $u '^due again: false$' 'a failed check waits out the schedule'
            if ($u -match '^(update |up to date)') { throw "a failed check reported a result" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

          Write-Host "probe monitors --min-aspect 1.0"
          $m = Probe @('--probe', 'monitors', '--min-aspect', '1.0')
          $primary = $m -match '^monitor \d+: full .* primary true$'
          if ($primary.Count -ne 1) { throw "want one primary monitor line, got $($primary.Count)" }
          $n = [regex]::Match($primary[0], 'full (-?\d+) (-?\d+) (\d+) (\d+) usable (-?\d+) (-?\d+) (\d+) (\d+)')
          if ([int]$n.Groups[8].Value -ge [int]$n.Groups[4].Value) { throw "usable height is not below full height" }
          Expect $m '^ultrawide: 0$' 'ultrawide 0 at min aspect 1.0'

          Write-Host "probe monitors"
          $m = Probe @('--probe', 'monitors')
          Expect $m '^ultrawide: none$' 'no ultrawide at the default min aspect'
          Expect $m '^host: \d+ ultrawide false scale \d' 'a normal monitor hosts at the default min aspect'

          Write-Host "probe monitors --min-aspect 3.0"
          Expect (Probe @('--probe', 'monitors', '--min-aspect', '3.0')) '^ultrawide: none$' 'no ultrawide at min aspect 3.0'

          Write-Host "probe list with one Notepad"
          $first = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          $l = Probe @('--probe', 'list')
          $windows = @($l -match '^window ')
          $pads = @($windows -match 'notepad\.exe frame')
          if ($pads.Count -ne 1) { throw "want one notepad line, got $($pads.Count)" }
          if (-not ($pads[0] -match 'frame -?\d+ -?\d+ [1-9]\d* [1-9]\d* main true')) { throw "notepad frame empty or not main" }
          if ($windows.Count -gt 6) { throw "want at most 6 windows, got $($windows.Count)" }

          Write-Host "probe list with two Notepads"
          $second = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          $l = Probe @('--probe', 'list')
          $pads = @($l -match 'notepad\.exe frame')
          if ($pads.Count -ne 2) { throw "want two notepad lines, got $($pads.Count)" }
          $mains = @($pads -match 'main true')
          if ($mains.Count -ne 1) { throw "want one notepad main, got $($mains.Count)" }
          Stop-Process -Id $first.Id, $second.Id

          function Placed($lines) {
            @($lines -match '^asked: ' | ForEach-Object {
              $n = [regex]::Match($_, '^asked: (-?\d+) (-?\d+) (\d+) (\d+) placed: (-?\d+) (-?\d+) (\d+) (\d+)$')
              if (-not $n.Success) { throw "bad place line: $_" }
              $off = 0
              foreach ($i in 1..4) { $off = [Math]::Max($off, [Math]::Abs([int]$n.Groups[$i].Value - [int]$n.Groups[$i + 4].Value)) }
              $off
            })
          }

          Write-Host "probe place"
          $pad = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          $p = Probe @('--probe', 'place')
          $offs = Placed $p
          if ($offs.Count -ne 2) { throw "want two placements, got $($offs.Count)" }
          if (($offs | Measure-Object -Maximum).Maximum -gt 1) { throw "placement off by more than 1 px: $offs" }
          Expect $p '^delta: -?\d+ -?\d+ -?\d+ -?\d+ elevated false$' 'delta line'

          Write-Host "probe place --no-delta"
          $p = Probe @('--probe', 'place', '--no-delta')
          $offs = Placed $p
          $zero = $p -match '^delta: 0 0 0 0 '
          if ($zero) { Write-Host "  inconclusive: Notepad has no invisible border" }
          elseif (($offs | Measure-Object -Maximum).Maximum -le 1) { throw "placement without the delta landed, so the correction is untested" }
          Stop-Process -Id $pad.Id

          function Rect([string] $line, [string] $prefix) {
            $n = [regex]::Match($line, [regex]::Escape($prefix) + '(-?\d+) (-?\d+) (\d+) (\d+)')
            if (-not $n.Success) { throw "no rect after '$prefix' in: $line" }
            ,@(1..4 | ForEach-Object { [int]$n.Groups[$_].Value })
          }
          function Off($a, $b) {
            $off = 0
            foreach ($i in 0..3) { $off = [Math]::Max($off, [Math]::Abs($a[$i] - $b[$i])) }
            $off
          }
          function At([string] $line) { [double][regex]::Match($line, ' at ([\d.]+)').Groups[1].Value }
          function Moor([string] $log, [string[]] $moorArgs, [scriptblock] $during) {
            $p = Start-Process $exe -ArgumentList $moorArgs -RedirectStandardOutput $log -NoNewWindow -PassThru
            $null = $p.Handle
            & $during
            $p.WaitForExit()
            $lines = @(Get-Content $log)
            $lines | ForEach-Object { Write-Host "  $_" }
            if ($p.ExitCode -ne 0) { throw "moor exited $($p.ExitCode)" }
            ,$lines
          }

          $script:standIn = $false
          $script:stands = 0
          function Pad {
            if (-not $script:standIn) { return Start-Process notepad -PassThru }
            $script:stands++
            $log = Join-Path $env:RUNNER_TEMP "stand$($script:stands).txt"
            Start-Process $exe -ArgumentList @('--probe', 'stand', '--seconds', '600') -RedirectStandardOutput $log -NoNewWindow -PassThru
          }

          function Events([string] $name, [string[]] $extra, [string] $frame) {
            $script:nudge = $null
            $e = Moor (Join-Path $env:RUNNER_TEMP "$name.txt") (@('--probe', 'events', '--seconds', '10') + $extra) {
              Start-Sleep -Seconds 4
              $script:nudge = Probe @('--probe', 'nudge', '--pid', "$($pad.Id)", '--frame', $frame)
            }
            $n = [regex]::Match(($e -match '^raw events: ')[0], 'raw events: (\d+) passed: (\d+)')
            if (-not $n.Success) { throw "no event counts" }
            [pscustomobject]@{ Lines = $e; Nudge = $script:nudge; Raw = [int]$n.Groups[1].Value; Passed = [int]$n.Groups[2].Value }
          }

          Write-Host "probe events filter control"
          $pad = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          $run = Events 'events' @() '200,150,500,350'
          $raw = Events 'events-raw' @('--no-filter') '250,180,500,350'
          if ($run.Passed -ge $run.Raw) { throw "filter dropped none of $($run.Raw) events: the filter is untested" }
          if ($raw.Passed -ne $raw.Raw) { throw "no-filter run dropped events: passed $($raw.Passed) of $($raw.Raw)" }
          Write-Host "  check: filter passed $($run.Passed) of $($run.Raw) events, no filter passed $($raw.Passed) of $($raw.Raw)"
          Stop-Process -Id $pad.Id

          function Slots($lines) {
            $slots = [ordered]@{}
            $slot = $null
            foreach ($line in $lines) {
              $n = [regex]::Match($line, '^menu   \[.\] ((Left|Right) (top|bottom)): ')
              if ($n.Success) { $slot = $n.Groups[1].Value; $slots[$slot] = @(); continue }
              if ($line -match '^menu   \S|^menu \S') { $slot = $null; continue }
              $n = [regex]::Match($line, '^menu     \[(.)\] (.+)$')
              if ($slot -and $n.Success) { $slots[$slot] += $n.Groups[2].Value }
            }
            $slots
          }

          Write-Host "probe menu"
          $pad = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          $menu = Probe @('--probe', 'menu', '--min-aspect', '1.0')
          Expect $menu '^menu \[ \] Widths$' 'Widths on an ultrawide'
          if ((Probe @('--probe', 'menu')) -match 'Widths') { throw "a normal host offered Widths" }
          Write-Host "  check: Widths is offered on an ultrawide and not on a normal host"
          $slots = Slots $menu
          $want = @('Left top', 'Left bottom', 'Right top', 'Right bottom')
          if ((@($slots.Keys) -join ',') -ne ($want -join ',')) { throw "slot titles are $(@($slots.Keys) -join ', ')" }
          foreach ($key in $want) {
            if (-not ($slots[$key] -contains 'notepad.exe')) { throw "no notepad.exe under $key" }
            if ($slots[$key][0] -ne 'Clear') { throw "$key does not start with Clear" }
          }
          Expect $menu '^menu \[ \] Pause$' 'Pause unchecked'
          if (@($menu -match '^menu   \[ \] Left \d+%, right \d+%$').Count -ne 3) { throw "want the three built-in width pairs unchecked" }
          Write-Host "  check: four slots each list notepad.exe, Pause unchecked"
          Expect $menu '^menu \[ \] Organize$' 'the Organize folder'
          Expect $menu '^menu   \[ \] Tile columns$' 'Tile columns under Organize'
          Expect $menu '^menu   \[ \] Cycle stacked windows$' 'Cycle stacked windows under Organize'
          Expect $menu '^menu \[ \] Channel$' 'the Channel folder'
          Expect $menu '^menu   \[ \] Fit channel$' 'Fit channel under Channel'
          Expect $menu '^menu   \[ \] Tidy 2 front windows$' 'Tidy 2 under Channel'
          Expect $menu '^menu   \[ \] Tidy 3 front windows$' 'Tidy 3 under Channel'
          if (@($menu -match '^menu   \[ \] Undo tidy \(off\)$').Count -ne 2) { throw "want Undo tidy off under both folders with nothing to undo" }
          if (@($menu -match '^menu   \[ \] Fit channel$').Count -ne 1) { throw "Fit channel is not listed once, under Channel only" }
          Write-Host "  check: Organize and Channel folders with Tidy 2 and 3 and Undo tidy off with nothing to undo"
          Expect $menu '^menu \[ \] Workspaces$' 'the Workspaces folder'
          Expect $menu '^menu   \[ \] Save workspace$' 'Save workspace under Workspaces'
          Write-Host "  check: Workspaces folder with Save workspace"

          Write-Host "probe menu after writing paused: true and widths 15 and 40"
          $file = Join-Path $env:APPDATA 'Moorings\choices.json'
          $c = Get-Content $file -Raw | ConvertFrom-Json
          $c | Add-Member -NotePropertyName paused -NotePropertyValue $true -Force
          $c | Add-Member -NotePropertyName widths -NotePropertyValue ([pscustomobject]@{ left = 15; right = 40 }) -Force
          $c | ConvertTo-Json -Depth 32 | Set-Content $file
          $menu = Probe @('--probe', 'menu', '--min-aspect', '1.0')
          Expect $menu '^menu \[x\] Pause$' 'Pause checked'
          Expect $menu '^menu   \[x\] Left 15%, right 40%$' 'the saved width pair checked'
          Expect $menu '^menu   \[ \] Tile columns \(off\)$' 'Tile columns off while paused'
          Expect $menu '^menu   \[ \] Tidy 2 front windows \(off\)$' 'Tidy 2 off while paused'
          Expect $menu '^menu   \[ \] Save workspace \(off\)$' 'Save workspace off while paused'
          Write-Host "  check: Pause checked, saved width pair checked, organize and workspace entries off"

          Write-Host "probe menu --no-apps"
          $slots = Slots (Probe @('--probe', 'menu', '--no-apps'))
          foreach ($key in $want) {
            if (($slots[$key] -join ',') -ne 'Clear') { throw "$key holds $($slots[$key] -join ', ') with no running apps" }
          }
          Write-Host "  check: with no running apps each slot holds only Clear"

          Write-Host "probe tray"
          $t = Probe @('--probe', 'tray')
          Expect $t '^icon: loaded$' 'the embedded icon decoded'
          Expect $t '^added: true$' 'the notification area took the icon'
          Expect $t '^saved left top: .*\\notepad\.exe$' 'the slot command saved Notepad'
          Expect $t '^saved paused: true$' 'the Pause command saved'
          Write-Host "  check: icon added, slot and Pause commands saved"
          Stop-Process -Id $pad.Id

          function Hotkeys([string[]] $geo) {
            $null = Probe @('--probe', 'nudge', '--pid', "$($pad.Id)", '--frame', '200,150,500,350')
            Probe (@('--probe', 'hotkeys', '--seconds', '2') + $geo)
          }

          # Links and --action against the real app with its own settings: a known start frame, then each
          # form must leave the same window on the channel's left half and still in front, which fails if
          # a console or anything else takes the foreground first.
          function LinkCheck([string[]] $geo) {
            Write-Host "links $geo"
            $pad = Pad
            Start-Sleep -Seconds 3
            $root = Join-Path $env:RUNNER_TEMP "links-$($pad.Id)"
            New-Item -ItemType Directory -Force -Path (Join-Path $root 'Roaming'), (Join-Path $root 'Local') | Out-Null
            $roaming, $local = $env:APPDATA, $env:LOCALAPPDATA
            $env:APPDATA, $env:LOCALAPPDATA = (Join-Path $root 'Roaming'), (Join-Path $root 'Local')
            function LinkState([string[]] $more) { Probe (@('--probe', 'link', '--pid', "$($pad.Id)") + $more + $geo) }
            function WaitTray {
              $until = (Get-Date).AddSeconds(15)
              while ((Get-Date) -lt $until) {
                if ((Probe (@('--probe', 'link') + $geo)) -contains 'tray windows: 1') { return }
                Start-Sleep -Milliseconds 500
              }
              throw "no tray window after 15 s"
            }
            function Place {
              $null = LinkState @('--frame', '200,150,500,350')
              Start-Sleep -Seconds 2
              $s = LinkState @()
              if (-not ($s -contains 'foreground: yes')) { throw "the stand-in is not in front at the start" }
              Rect ($s -match '^frame: ')[0] 'frame: '
            }
            function Refused([string[]] $form) {
              $o = @(& $exe @form | ForEach-Object { $_ })
              $code = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              Write-Host "  $form -> $code $($o -join ' / ')"
              ,@($code, $o)
            }
            function OnHalf([string] $form) {
              Start-Sleep -Seconds 2
              $s = LinkState @()
              if (-not ($s -contains 'foreground: yes')) { throw "$form left the stand-in behind another window" }
              $channel = Rect ($s -match '^channel: ')[0] 'channel: '
              $half = @($channel[0], $channel[1], [Math]::Floor($channel[2] / 2), $channel[3])
              $off = Off (Rect ($s -match '^frame: ')[0] 'frame: ') $half
              if ($off -gt 1) { throw "after $form the stand-in is off the channel's left half by $off px" }
              Write-Host "  check: $form put the window in front on the channel's left half, off by $off"
            }
            $app = Start-Process $exe -ArgumentList $geo -PassThru
            $null = $app.Handle
            WaitTray

            $command = (Get-ItemProperty 'HKCU:\Software\Classes\moorings\shell\open\command').'(default)'
            if ($command -ine "`"$exe`" `"%1`"") { throw "the link command is $command" }
            if ($null -eq (Get-ItemProperty 'HKCU:\Software\Classes\moorings').'URL Protocol') { throw "the scheme has no URL Protocol value" }
            Write-Host "  check: the scheme runs $command"

            $null = Place
            Expect (Probe @('--action', 'left-half')) '^ran: left-half$' '--action said it ran'
            OnHalf '--action'
            $null = Place
            & cmd.exe /c 'start moorings://action?name=left-half'
            OnHalf 'the shell opening the link'

            Write-Host "links negative controls"
            $start = Place
            $r = Refused @('--action', 'no-such-action')
            if ($r[0] -eq 0 -or -not ($r[1] -contains 'unknown action: no-such-action')) { throw "--action ran an unknown name" }
            Start-Sleep -Seconds 1
            $off = Off (Rect ((LinkState @()) -match '^frame: ')[0] 'frame: ') $start
            if ($off -gt 1) { throw "an unknown action moved the window by $off px" }
            Write-Host "  check: an unknown action says so, exits nonzero and moves nothing"
            foreach ($form in @(@('moorings://action?name=close-window'), @('--action', 'close-window'))) {
              $r = Refused $form
              if ($r[0] -eq 0 -or -not ($r[1] -match '^refused: close-window: ')) { throw "$form was not refused" }
            }
            Start-Sleep -Seconds 1
            if (-not ((LinkState @()) -contains 'window: alive')) { throw "a link closed the window" }
            Write-Host "  check: close-window is refused from a link and from --action, and the window lives"
            $r = Refused @('moorings://action?name=no-such-action', '--probe', 'version')
            if ($r[0] -eq 0 -or -not ($r[1] -contains 'unknown action: no-such-action') -or ($r[1] -match '^version: ')) { throw "a link added a flag of its own" }
            $r = Refused @('moorings://elsewhere?name=left-half')
            if ($r[0] -eq 0 -or -not ($r[1] -match '^unknown link: ')) { throw "a link to another host ran" }
            Write-Host "  check: flags after a link are ignored, and a link to another host is unknown"
            $start = Place
            $other = Pad
            Start-Sleep -Seconds 3
            function OtherState([string[]] $more) { Probe (@('--probe', 'link', '--pid', "$($other.Id)") + $more + $geo) }
            $null = OtherState @('--frame', '300,200,500,350')
            Start-Sleep -Seconds 2
            if (-not ((LinkState @()) -contains 'foreground: no')) { throw "the foreground line did not read no with another window in front" }
            Expect (Probe @('--action', 'left-half')) '^ran: left-half$' '--action said it ran with another window in front'
            Start-Sleep -Seconds 2
            $s = OtherState @()
            if (-not ($s -contains 'foreground: yes')) { throw "the other window left the front" }
            $channel = Rect ($s -match '^channel: ')[0] 'channel: '
            $half = @($channel[0], $channel[1], [Math]::Floor($channel[2] / 2), $channel[3])
            $off = Off (Rect ($s -match '^frame: ')[0] 'frame: ') $half
            if ($off -gt 1) { throw "the action missed the window in front by $off px" }
            $off = Off (Rect ((LinkState @()) -match '^frame: ')[0] 'frame: ') $start
            if ($off -gt 1) { throw "the action moved the window behind by $off px" }
            Stop-Process -Id $other.Id
            Write-Host "  check: with another window in front the foreground line reads no, and the action moves that window and not the one behind"
            $second = Start-Process $exe -PassThru
            $null = $second.Handle
            if (-not $second.WaitForExit(15000)) { Stop-Process -Id $second.Id -Force; throw "a second plain launch stayed up" }
            if ($second.ExitCode -ne 0) { throw "a second plain launch exited $($second.ExitCode)" }
            if (-not ((Probe (@('--probe', 'link') + $geo)) -contains 'tray windows: 1')) { throw "a second plain launch left another tray" }
            Write-Host "  check: a second plain launch exits 0 and leaves one tray window"

            Stop-Process -Id $app.Id -Force
            $app.WaitForExit()
            $start = Place
            $r = Refused @('--action', 'left-half')
            if ($r[0] -eq 0 -or -not ($r[1] -contains 'not running')) { throw "--action with no tray did not say not running" }
            if ((Probe (@('--probe', 'link') + $geo)) -notcontains 'tray windows: 0') { throw "--action started a tray" }
            $r = Refused @('moorings://action?name=no-such-action')
            if ($r[0] -eq 0 -or (Probe (@('--probe', 'link') + $geo)) -notcontains 'tray windows: 0') { throw "a bad link started the app" }
            Write-Host "  check: with no tray --action says not running, and neither it nor a bad link starts the app"

            # A link cannot carry the fake screen, so the start by link is read only on the real one.
            if ($geo -notcontains '--screen') {
              $null = Place
              $cold = Start-Process $exe -ArgumentList 'moorings://action?name=left-half' -PassThru
              $null = $cold.Handle
              WaitTray
              Start-Sleep -Seconds 2
              $s = LinkState @()
              $f = Rect ($s -match '^frame: ')[0] 'frame: '
              Stop-Process -Id $cold.Id -Force
              $cold.WaitForExit()
              if ($f[0] -gt 1 -or $f[3] -le 350 -or -not ($s -contains 'foreground: yes')) { throw "a link with no tray left the window at $($f -join ' ')" }
              Write-Host "  check: a link with no tray started Moorings and ran, frame $($f -join ' ')"
            }
            $env:APPDATA, $env:LOCALAPPDATA = $roaming, $local
            Stop-Process -Id $pad.Id
          }

          function ButtonCheck([string[]] $geo) {
            Write-Host "probe buttons $geo"
            $pad = Pad
            $front = Pad
            Start-Sleep -Seconds 3
            $root = Join-Path $env:RUNNER_TEMP "buttons-$($pad.Id)"
            New-Item -ItemType Directory -Force -Path (Join-Path $root 'Roaming'), (Join-Path $root 'Local') | Out-Null
            $roaming, $local = $env:APPDATA, $env:LOCALAPPDATA
            $env:APPDATA, $env:LOCALAPPDATA = (Join-Path $root 'Roaming'), (Join-Path $root 'Local')
            function Buttons([string[]] $more) {
              Probe (@('--probe', 'buttons', '--pid', "$($pad.Id)", '--other', "$($front.Id)", '--seconds', '60') + $more + $geo)
            }
            function Case($lines, [string] $name) {
              $n = [regex]::Match((@($lines -match "^case ${name}: ")[0] + ''), "^case ${name}: frame (-?\d+) (-?\d+) (\d+) (\d+) zoomed (yes|no) minimized (yes|no) front (yes|no)$")
              if (-not $n.Success) { throw "no state line for case $name" }
              @{ Frame = @(1..4 | ForEach-Object { [int]$n.Groups[$_].Value }); Zoomed = $n.Groups[5].Value; Minimized = $n.Groups[6].Value; Front = $n.Groups[7].Value }
            }
            Write-Host "probe nativeclicks, no hook in this process $geo"
            $native = Probe (@('--probe', 'nativeclicks', '--pid', "$($pad.Id)") + $geo)
            $h = Buttons @()
            $channel = Rect ($h -match '^channel: ')[0] 'channel: '
            $half = [Math]::Floor($channel[2] / 2)
            $sides = @{ left = @($channel[0], $channel[1], $half, $channel[3]); right = @(($channel[0] + $half), $channel[1], $half, $channel[3]) }
            $want = [ordered]@{ back = 'left'; forward = 'right'; middle = 'left'; 'shift-maximize' = 'left'; 'alt-minimize' = 'right'; behind = 'left'; 'windows-close' = 'left' }
            foreach ($name in $want.Keys) {
              $c = Case $h $name
              $off = Off $c.Frame $sides[$want[$name]]
              if ($off -gt 1) { throw "case $name is off the $($want[$name]) half by $off px" }
              if ($c.Zoomed -ne 'no' -or $c.Minimized -ne 'no') { throw "case $name also reached the window: zoomed $($c.Zoomed) minimized $($c.Minimized)" }
              if ($name -ne 'behind' -and $c.Front -ne 'yes') { throw "case $name left the window behind another" }
            }
            Write-Host "  check: back, forward, middle, and the bound Shift, Alt and Windows clicks reached their halves, not the window's own button, and the window stayed in front"
            $off = Off (Case $h 'behind front window').Frame (Case $h 'before behind front window').Frame
            if ($off -gt 1) { throw "the click behind moved the window in front by $off px" }
            Write-Host "  check: a bound click on a window behind another moved the clicked one and not the one in front"
            $off = Off (Case $h 'shift-caption').Frame (Case $h 'before shift-caption').Frame
            if ($off -gt 1) { throw "Shift on the caption, off a button, moved the window by $off px" }
            Write-Host "  check: Shift on the caption but off a button ran nothing"
            foreach ($name in @('plain-minimize', 'plain-maximize', 'minimize-after-maximize')) {
              $with = Case $h $name
              $alone = Case $native $name
              if ($with.Zoomed -ne $alone.Zoomed -or $with.Minimized -ne $alone.Minimized) {
                throw "$name with the hook: zoomed $($with.Zoomed) minimized $($with.Minimized), alone: zoomed $($alone.Zoomed) minimized $($alone.Minimized)"
              }
            }
            Write-Host "  check: unbound clicks did the same with the hook as with no hook"
            if ((Case $h 'plain-maximize').Zoomed -ne 'yes') { throw "an unbound maximize did not maximize" }
            $min = Case $h 'plain-minimize'
            if ($min.Zoomed -ne 'yes' -and $min.Minimized -ne 'yes') { throw "an unbound minimize click changed nothing" }
            Write-Host "  check: unbound maximize and minimize clicks reach the window"
            $slow = [int][regex]::Match(($h -match '^hook slowest: ')[0], '(\d+) ms').Groups[1].Value
            if ($slow -ge 300) { throw "the hook took $slow ms to decide, past the 300 ms Windows allows by default" }
            Write-Host "  check: the hook decided within $slow ms"

            Write-Host "probe buttons negative controls $geo"
            $n = Buttons @('--no-swallow')
            if ((Case $n 'shift-maximize').Zoomed -ne 'yes') { throw "with the swallow removed and no action run, the bound maximize click did not maximize" }
            Write-Host "  check: with the swallow removed and no action run, the bound Shift-maximize click maximizes, where the normal run read zoomed no"
            $q = Buttons @('--paused')
            foreach ($name in @('back', 'forward', 'middle')) {
              $off = Off (Case $q $name).Frame (Case $q "before $name").Frame
              if ($off -gt 1) { throw "paused, case $name moved the window by $off px" }
            }
            if ((Case $q 'shift-maximize').Zoomed -ne 'yes') { throw "paused, a bound click did not reach the window" }
            Write-Host "  check: paused, the extra buttons run nothing and a bound click reaches the window"
            $env:APPDATA, $env:LOCALAPPDATA = $roaming, $local
            Stop-Process -Id $pad.Id
            Stop-Process -Id $front.Id
          }

          function HotkeyCheck([string[]] $geo) {
            Write-Host "probe hotkeys $geo"
            $pad = Pad
            Start-Sleep -Seconds 3
            $h = Hotkeys $geo
            $n = [regex]::Match(($h -match '^table: ')[0], '^table: (\d+) registered: (\d+) skipped: (\d+)$')
            if (-not $n.Success) { throw "no table line" }
            $table = [int]$n.Groups[1].Value; $reg = [int]$n.Groups[2].Value; $skip = [int]$n.Groups[3].Value
            if ($reg -eq 0 -or $reg + $skip -ne $table) { throw "registered $reg plus skipped $skip is not the table's $table" }
            if (@($h -match '^skipped ').Count -ne $skip) { throw "skipped lines do not match the skipped count" }
            Expect $h '^hotkeys received: left-half$' 'the injected Ctrl+Alt+Left reached WM_HOTKEY as left-half'
            $channel = Rect ($h -match '^channel: ')[0] 'channel: '
            $half = @($channel[0], $channel[1], [Math]::Floor($channel[2] / 2), $channel[3])
            $off = Off (Rect ($h -match '^after: ')[0] 'after: ') $half
            if ($off -gt 1) { throw "after the chord Notepad is off the channel's left half by $off px" }
            Write-Host "  check: $reg registered and $skip skipped of $table, Ctrl+Alt+Left put Notepad on the channel's left half"

            Write-Host "probe hotkeys $geo while another process holds Ctrl+Alt+Left"
            $holdLog = Join-Path $env:RUNNER_TEMP 'hold.txt'
            $holder = Start-Process $exe -ArgumentList @('--probe', 'hold', '--seconds', '8') -RedirectStandardOutput $holdLog -NoNewWindow -PassThru
            $null = $holder.Handle
            Start-Sleep -Seconds 2
            $h = Hotkeys $geo
            $holder.WaitForExit()
            $held = @(Get-Content $holdLog)
            $held | ForEach-Object { Write-Host "  $_" }
            Expect $held '^held: true$' 'the hold probe took Ctrl+Alt+Left'
            Expect $h '^skipped left-half: another program holds it$' 'left-half skipped while held'
            Expect $h '^hotkeys received: none$' 'no press reached a skipped chord'
            if ((Off (Rect ($h -match '^after: ')[0] 'after: ') @(200, 150, 500, 350)) -gt 1) { throw "a skipped chord moved Notepad" }
            Expect $held '^hotkeys received: 1$' 'the injected chord reached the holder'
            Write-Host "  check: held chord skipped, Notepad unchanged, the holder got the press"
            Stop-Process -Id $pad.Id
            $script:channel = $channel
          }
          HotkeyCheck @('--min-aspect', '1.0')
          LinkCheck @('--min-aspect', '1.0')
          ButtonCheck @('--min-aspect', '1.0')

          # On German, AltGr and E is the euro sign and Ctrl+Alt+E is first-two-thirds. AltGr must type
          # the character and move nothing, left Ctrl with left Alt must still run the shortcut, and so
          # must Ctrl with right Alt on US, which has no AltGr. The control turns the rule off, and the
          # same AltGr press must then run the shortcut and type nothing.
          function AltGrProbe([string[]] $extra) {
            Probe (@('--probe', 'altgr', '--seconds', '30', '--min-aspect', '1.0') + $extra)
          }
          function PhaseFrame($lines, [string] $phase) { Rect ($lines -match "^$phase frame: ")[0] "$phase frame: " }
          Write-Host "probe altgr"
          $a = AltGrProbe @()
          Expect $a '^altgr rule: on$' 'the AltGr rule is on'
          Expect $a '^chord: first-two-thirds Ctrl\+Alt\+E$' 'Ctrl+Alt+E is first-two-thirds'
          foreach ($p in 'altgr', 'ctrl-alt') { Expect $a "^$p layout: 04070407$" "German in front for $p" }
          Expect $a '^us layout: 04090409$' 'US in front for the US phase'
          foreach ($p in 'altgr', 'ctrl-alt', 'us') { Expect $a "^$p foreground: true$" "the stand-in in front for $p" }
          $start = Rect ($a -match '^start: ')[0] 'start: '
          Expect $a '^altgr text: U\+20AC$' 'AltGr and E typed the euro sign'
          $off = Off (PhaseFrame $a 'altgr') $start
          if ($off -gt 1) { throw "AltGr and E moved the stand-in by $off px" }
          Expect $a '^ctrl-alt text: empty$' 'left Ctrl, left Alt and E typed nothing'
          Expect $a '^us text: empty$' 'Ctrl, right Alt and E on US typed nothing'
          $ca = PhaseFrame $a 'ctrl-alt'
          $us = PhaseFrame $a 'us'
          if ((Off $ca $start) -le 20) { throw "left Ctrl, left Alt and E left the stand-in where it started" }
          $off = Off $ca $us
          if ($off -gt 1) { throw "the German and US shortcut frames differ by $off px" }
          Expect $a '^hotkeys received: first-two-thirds,first-two-thirds$' 'two shortcut presses and none for AltGr'
          Expect $a '^report: shortcuts given up:$' 'the shortcuts given up section of the report'
          Expect $a '^report: AltGr: first-two-thirds Ctrl\+Alt\+E typed U\+20AC on layout 04070407$' 'the AltGr line in the report'
          Write-Host "  check: AltGr+E typed U+20AC and moved nothing, left Ctrl+Alt+E and US Ctrl+right Alt+E ran first-two-thirds to $($ca -join ' ')"

          Write-Host "altgr negative control: --no-altgr"
          $n = AltGrProbe @('--no-altgr')
          Expect $n '^altgr rule: off$' 'the AltGr rule is off'
          Expect $n '^altgr text: empty$' 'with the rule off AltGr and E typed nothing'
          if ((Off (PhaseFrame $n 'altgr') $start) -le 20) { throw "with the rule off AltGr and E did not run the shortcut" }
          Expect $n '^hotkeys received: first-two-thirds,first-two-thirds,first-two-thirds$' 'three shortcut presses with the rule off'
          Expect $n '^report: shortcuts given up:$' 'the shortcuts given up section of the report with the rule off'
          if ($n -match '^report: AltGr: ') { throw "with the rule off the report lists an AltGr line" }
          Write-Host "  check: with the rule off AltGr+E ran first-two-thirds, typed nothing, and the report lists no AltGr line"

          # The menu action opens the tray menu at the pointer, and once it closes the foreground goes
          # back to the window that was in front. The foreground read while the menu is open is the
          # control: it shows the menu took the foreground, so the read after shows it came back.
          Write-Host "probe pointermenu"
          $pad = Pad
          Start-Sleep -Seconds 3
          $pm = Probe @('--probe', 'pointermenu', '--seconds', '10', '--min-aspect', '1.0')
          Expect $pm '^chord: Ctrl\+Alt\+Shift\+F9 bound true$' 'show-menu bound on Windows'
          $ids = [regex]::Match(($pm -match '^notepad: ')[0], '^notepad: (0x[0-9a-f]+) tray: (0x[0-9a-f]+)$')
          if (-not $ids.Success) { throw "no notepad and tray ids" }
          $note, $trayId = $ids.Groups[1].Value, $ids.Groups[2].Value
          Expect $pm "^foreground before: $note$" 'Notepad in front before the chord'
          Expect $pm '^hotkeys received: show-menu$' 'one show-menu press'
          $box = Rect ($pm -match '^menu: ')[0] 'menu: '
          $ptr = [regex]::Match(($pm -match '^pointer: ')[0], '^pointer: (-?\d+) (-?\d+)$')
          if (-not $ptr.Success) { throw "no pointer line" }
          $dx = [Math]::Abs($box[0] - [int]$ptr.Groups[1].Value); $dy = [Math]::Abs($box[1] - [int]$ptr.Groups[2].Value)
          if ($dx -gt 2 -or $dy -gt 2) { throw "the menu opened at $($box[0]) $($box[1]), not at the pointer $($ptr.Groups[1].Value) $($ptr.Groups[2].Value)" }
          Expect $pm "^foreground open: $trayId$" 'the menu took the foreground while open'
          Expect $pm '^menu after: (none|hidden)$' 'the menu closed'
          Expect $pm "^foreground after: $note$" 'the foreground went back to Notepad'
          Write-Host "  check: show-menu opened the menu at the pointer with the foreground, and Notepad had it back after"
          Stop-Process -Id $pad.Id -ErrorAction SilentlyContinue

          Write-Host "probe banner"
          $b = Probe @('--probe', 'banner', '--min-aspect', '1.0')
          $line = ($b -match '^banner: ')[0]
          $box = Rect $line 'banner: '
          $screen = Rect ($b -match '^screen: ')[0] 'screen: '
          $scale = [double][regex]::Match($line, ' scale ([\d.]+)$').Groups[1].Value
          if ($scale -le 0) { throw "no scale in: $line" }
          if ([Math]::Abs($box[2] - [Math]::Round(380 * $scale)) -gt 1) { throw "banner is $($box[2]) px wide, not 380 points" }
          $mid = $box[0] + $box[2] / 2 - ($screen[0] + $screen[2] / 2)
          if ([Math]::Abs($mid) -gt 1) { throw "banner is $mid px off the screen's center" }
          if ([Math]::Abs($box[1] - $screen[1] - [Math]::Round(10 * $scale)) -gt 1) { throw "banner is not at the top of the screen" }
          Expect $b '^visible: true topmost: true noactivate: true$' 'a visible top-most banner that never activates'
          Expect $b '^foreground is banner: false ' 'the banner did not take the foreground'
          Expect $b '^open at 1 s: true$' 'the banner still open at 1 s'
          Expect $b '^closed: true$' 'the banner closed itself after the fade'
          Write-Host "  check: banner at the top center, not the foreground, closed after the fade"

          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;

          // Medium starts a command with a copy of this process's token lowered to medium integrity,
          // so windows of the runner's high integrity processes outrank it as an elevated app does.
          public static class Medium {
              [StructLayout(LayoutKind.Sequential)]
              struct SidAndAttributes { public IntPtr Sid; public uint Attributes; }
              [StructLayout(LayoutKind.Sequential)]
              struct MandatoryLabel { public SidAndAttributes Label; }
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct StartupInfo {
                  public int cb; public string reserved, desktop, title;
                  public int x, y, xSize, ySize, xChars, yChars, fill, flags;
                  public short show, reserved2; public IntPtr reserved3, stdIn, stdOut, stdErr;
              }
              [StructLayout(LayoutKind.Sequential)]
              struct ProcessInfo { public IntPtr process, thread; public int pid, tid; }

              [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
              [DllImport("kernel32.dll")] static extern uint WaitForSingleObject(IntPtr h, uint ms);
              [DllImport("kernel32.dll")] static extern bool GetExitCodeProcess(IntPtr h, out uint code);
              [DllImport("advapi32.dll", SetLastError = true)]
              static extern bool OpenProcessToken(IntPtr process, uint access, out IntPtr token);
              [DllImport("advapi32.dll", SetLastError = true)]
              static extern bool DuplicateTokenEx(IntPtr token, uint access, IntPtr attrs, int level, int type, out IntPtr dup);
              [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern bool ConvertStringSidToSid(string sid, out IntPtr psid);
              [DllImport("advapi32.dll")] static extern int GetLengthSid(IntPtr sid);
              [DllImport("advapi32.dll", SetLastError = true)]
              static extern bool SetTokenInformation(IntPtr token, int cls, ref MandatoryLabel info, int length);
              [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern bool CreateProcessAsUser(IntPtr token, string app, string cmd, IntPtr pa, IntPtr ta,
                  bool inherit, uint flags, IntPtr env, string dir, ref StartupInfo si, out ProcessInfo pi);

              // Run starts cmd at medium integrity, waits up to ms, and returns its exit code.
              public static uint Run(string cmd, uint ms) {
                  IntPtr token, dup, sid;
                  if (!OpenProcessToken(GetCurrentProcess(), 0xF01FF, out token)) throw new Win32Exception();
                  if (!DuplicateTokenEx(token, 0xF01FF, IntPtr.Zero, 2, 1, out dup)) throw new Win32Exception();
                  if (!ConvertStringSidToSid("S-1-16-8192", out sid)) throw new Win32Exception();
                  var label = new MandatoryLabel();
                  label.Label.Sid = sid;
                  label.Label.Attributes = 0x20;
                  if (!SetTokenInformation(dup, 25, ref label, Marshal.SizeOf(label) + GetLengthSid(sid))) throw new Win32Exception();
                  var si = new StartupInfo();
                  si.cb = Marshal.SizeOf(si);
                  ProcessInfo pi;
                  if (!CreateProcessAsUser(dup, null, cmd, IntPtr.Zero, IntPtr.Zero, false, 0, IntPtr.Zero, null, ref si, out pi)) throw new Win32Exception();
                  if (WaitForSingleObject(pi.process, ms) != 0) throw new TimeoutException("medium run did not finish");
                  uint code;
                  GetExitCodeProcess(pi.process, out code);
                  return code;
              }
          }
          '@
          function Skip([string] $name, [bool] $medium, [string] $geo) {
            $log = Join-Path $env:RUNNER_TEMP "$name.txt"
            $cmd = Join-Path $env:RUNNER_TEMP "$name.cmd"
            Set-Content $cmd -Encoding ascii -Value @(
              '@echo off',
              'start "" notepad',
              'ping -n 4 127.0.0.1 > nul',
              "`"$exe`" --probe skip --seconds 8 $geo > `"$log`" 2>&1"
            )
            if ($medium) {
              $code = [Medium]::Run("cmd.exe /c `"$cmd`"", 45000)
            } else {
              $p = Start-Process cmd.exe -ArgumentList '/c', "`"$cmd`"" -NoNewWindow -PassThru
              if (-not $p.WaitForExit(45000)) { throw "the $name probe did not finish in 45 s" }
              $code = $p.ExitCode
            }
            $s = @(Get-Content $log)
            $s | ForEach-Object { Write-Host "  $_" }
            if ($code -ne 0) { throw "the $name probe exited $code" }
            ,$s
          }
          function Inside($s, [string] $id) {
            $channel = Rect ($s -match '^channel: ')[0] 'channel: '
            $f = Rect ($s -match "^final $id ")[0] 'frame '
            $f[0] -ge $channel[0] - 1 -and $f[0] + $f[2] -le $channel[0] + $channel[2] + 1
          }
          function Listed($s, [string] $pattern, [string] $what) {
            $line = @($s -match "^window 0x[0-9a-f]+: $pattern frame ")
            if ($line.Count -ne 1) { throw "the skip probe listed $($line.Count) $what windows" }
            [pscustomobject]@{
              Line = $line[0]
              Id = [regex]::Match($line[0], '^window (0x[0-9a-f]+)').Groups[1].Value
              Level = [regex]::Match($line[0], ' integrity (\w+)$').Groups[1].Value
            }
          }

          function SkipCheck([string] $geo) {
            Write-Host "probe skip $geo with Task Manager and a packaged app on the left strip"
            $lua = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA
            $me = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
            $admin = $me.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            Write-Host "  uac: $lua workflow elevated: $admin"
            $tm = Start-Process taskmgr -PassThru
            Start-Sleep -Seconds 3
            $calc = @(Get-AppxPackage -Name Microsoft.WindowsCalculator -ErrorAction SilentlyContinue)
            $launch = if ($calc.Count -gt 0) { 'calculator:' } else { 'ms-settings:' }
            Start-Process $launch
            Start-Sleep -Seconds 5
            $l = Probe @('--probe', 'list')
            $tmWindow = @($l -match '^window 0x[0-9a-f]+: .*\\taskmgr\.exe frame ')
            if ($tmWindow.Count -ne 1) { throw "want one Task Manager window, got $($tmWindow.Count)" }
            $frameHost = @(Get-Process ApplicationFrameHost -ErrorAction SilentlyContinue)
            if ($frameHost.Count -eq 0) { throw "no ApplicationFrameHost after starting $launch" }
            $null = Probe @('--probe', 'nudge', '--pid', "$($tm.Id)", '--frame', '0,0,380,500')
            $null = Probe @('--probe', 'nudge', '--pid', "$($frameHost[0].Id)", '--frame', '0,200,380,400')
            Write-Host "  skip at the runner's own integrity"
            $s = Skip "skip$($geo -replace '\W', '')" $false $geo
            $tmw = Listed $s '.*\\taskmgr\.exe' 'Task Manager'
            if ($s -match "^skipped $($tmw.Id): ") { throw "Task Manager skipped though it does not outrank the probe" }
            if (-not (Inside $s $tmw.Id)) { throw "Task Manager at the probe's level was not pushed into the channel" }
            Write-Host "  check: Task Manager at the probe's level ($($tmw.Level)) pushed into the channel"
            $pk = Listed $s '[^\\\s]+![^\s]+' 'packaged'
            $aumid = [regex]::Match($pk.Line, '^window 0x[0-9a-f]+: (\S+) frame ').Groups[1].Value
            if (-not ($s -match "^move $($pk.Id) at ")) { throw "the packaged app was not moved" }
            if (-not (Inside $s $pk.Id)) { throw "the packaged app is not inside the channel" }
            Write-Host "  check: $aumid from $launch listed by its user model id and pushed into the channel"

            Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process
            $null = Probe @('--probe', 'nudge', '--pid', "$($tm.Id)", '--frame', '0,0,380,500')
            Write-Host "  skip at medium integrity, below Task Manager"
            $s = Skip "skip-medium$($geo -replace '\W', '')" $true $geo
            Expect $s '^probe integrity: medium$' 'the probe at medium integrity'
            $tmw = Listed $s '.*\\taskmgr\.exe' 'Task Manager'
            if ($tmw.Level -eq 'medium') { throw "Task Manager runs at the probe's level, so nothing outranks it" }
            Expect $s "^skipped $($tmw.Id): elevated$" 'Task Manager skipped as elevated'
            $tries = @($s -match "^move $($tmw.Id) at ")
            if ($tries.Count -ne 1) { throw "want one try at Task Manager, got $($tries.Count)" }
            $quiet = (At ($s -match '^end at ')[0]) - (At $tries[0])
            if ($quiet -lt 5) { throw "only $quiet s ran after the refused try" }
            Expect $s '^notice: .+ runs as administrator: ' 'the elevated banner'
            if ((Off (Rect ($s -match "^final $($tmw.Id) ")[0] 'frame ') (Rect $tmw.Line 'frame ')) -gt 1) { throw "Task Manager moved" }
            Write-Host "  check: Task Manager ($($tmw.Level)) skipped as elevated after one try, none in the next $([Math]::Round($quiet, 1)) s, banner shown"
            Stop-Process -Id $tm.Id -ErrorAction SilentlyContinue
            Get-Process notepad, SystemSettings, CalculatorApp -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
          }
          SkipCheck '--min-aspect 1.0'

          Write-Host "probe login"
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          Remove-ItemProperty -Path $run -Name Moorings -ErrorAction SilentlyContinue
          $g = Probe @('--probe', 'login')
          Expect $g '^before: false$' 'no Run entry before'
          Expect $g '^after: true$' 'the command turned launch at login on'
          $path = [regex]::Match(($g -match '^executable: ')[0], '^executable: (.+)$').Groups[1].Value
          $value = (Get-ItemProperty -Path $run -Name Moorings -ErrorAction SilentlyContinue).Moorings
          if ($value -ne "`"$path`"") { throw "the Run entry holds '$value', not the quoted '$path'" }
          $g = Probe @('--probe', 'login')
          Expect $g '^before: true$' 'the Run entry read back'
          Expect $g '^after: false$' 'the command turned launch at login off'
          if ($null -ne (Get-ItemProperty -Path $run -Name Moorings -ErrorAction SilentlyContinue)) { throw "the Run entry is still there" }
          Write-Host "  check: Launch at login wrote the quoted exe path to the Run key and removed it"

          Write-Host "probe quit"
          $q = Probe @('--probe', 'quit')
          Expect $q '^added: true$' 'the tray icon added'
          $without = [double][regex]::Match(($q -match '^ran without quit: ')[0], ': ([\d.]+) s$').Groups[1].Value
          $after = [double][regex]::Match(($q -match '^ran after quit: ')[0], ': ([\d.]+) s$').Groups[1].Value
          if ($without -lt 1.9) { throw "the loop ended after $without s without Quit" }
          if ($after -gt 1) { throw "the loop ran $after s after Quit" }
          Expect $q '^icon gone: true$' 'the icon removed on quit'
          Write-Host "  check: the loop ran its 2 s without Quit, ended $after s after Quit, icon removed"

          function StashCheck([string[]] $geo) {
            Write-Host "probe stash $geo"
            $pad = Pad
            Start-Sleep -Seconds 3
            $null = Probe @('--probe', 'nudge', '--pid', "$($pad.Id)", '--frame', '200,150,500,350')
            $s = Probe (@('--probe', 'stash') + $geo)
            Expect $s '^stash ran: true$' 'the stash action ran through the engine'
            $before = Rect ($s -match '^before: ')[0] 'before: '
            $parked = Rect ($s -match '^parked: ')[0] 'parked: '
            if ((Off $parked $before) -lt 100) { throw "the window did not park: $parked from $before" }
            $sliver = [int][regex]::Match(($s -match '^sliver: ')[0], '(\d+)$').Value
            if ($sliver -lt 11 -or $sliver -gt 13) { throw "the sliver is $sliver px, want 12 within 1" }
            if ((Off (Rect ($s -match '^off: ')[0] 'off: ') $parked) -gt 1) { throw "a pointer off the sliver slid the window" }
            $shown = Rect ($s -match '^shown: ')[0] 'shown: '
            if ((Off (Rect ($s -match '^out: ')[0] 'out: ') $shown) -gt 1) { throw "resting on the sliver did not slide the window out" }
            if ((Off (Rect ($s -match '^back: ')[0] 'back: ') $parked) -gt 1) { throw "leaving the window did not slide it back" }
            Expect $s '^menu while stashed: true$' 'the tray offers Unstash all windows while a window is stashed'
            if ((Off (Rect ($s -match '^restored: ')[0] 'restored: ') $before) -gt 1) { throw "unstash-all did not restore the frame" }
            Expect $s '^stashed after unstash: 0$' 'unstash-all ended the stash'
            Expect $s '^menu after unstash: false$' 'the tray drops Unstash all windows with none stashed'
            Expect $s '^stashed after drag: 1$' 'a drag to the edge with the Windows key held stashed the window'
            $sliver = [int][regex]::Match(($s -match '^drag sliver: ')[0], '(\d+)$').Value
            if ($sliver -lt 11 -or $sliver -gt 13) { throw "the dragged window's sliver is $sliver px, want 12 within 1" }
            if ($s -match '^foreground after the Windows key: Windows\.UI\.Core\.CoreWindow') { throw "the Start menu opened after the drag" }
            Expect $s '^stashed after end session: 0$' 'the session end put the stash back'
            if ((Off (Rect ($s -match '^end session: ')[0] 'end session: ') $before) -gt 1) { throw "the session end did not restore the frame" }
            Write-Host "  check: parked with a $sliver px sliver, slid out on rest, back on leave, restored, drag stashed, session end restored"
            Stop-Process -Id $pad.Id
          }
          StashCheck @()

          # Frames reads the "label 0x...: x y w h" lines of one step of the organize probe, by window.
          function Frames($lines, [string] $label) {
            $out = [ordered]@{}
            foreach ($l in @($lines -match "^$label 0x[0-9a-f]+: ")) {
              $m = [regex]::Match($l, "^$label (0x[0-9a-f]+): (-?\d+) (-?\d+) (\d+) (\d+)$")
              if (-not $m.Success) { throw "unreadable $label line: $l" }
              $out[$m.Groups[1].Value] = @(2..5 | ForEach-Object { [int]$m.Groups[$_].Value })
            }
            $out
          }
          function Same($a, $b, [string] $why) {
            foreach ($k in $a.Keys) {
              if ((Off $a[$k] $b[$k]) -gt 1) { throw "${why}: $k at $($b[$k] -join ' '), was $($a[$k] -join ' ')" }
            }
          }
          # Each organize action is judged on the app's windows only, since another window may keep its
          # own minimum size, against the free window count the probe prints.
          function OrganizeCheck([string[]] $geo) {
            Write-Host "probe organize $geo"
            $pads = @(1..3 | ForEach-Object { Pad })
            Start-Sleep -Seconds 3
            $f = Probe (@('--probe', 'organize') + $geo)
            Expect $f '^pads: 3$' 'three windows of the app to organize'
            Expect $f '^paused: false$' 'a fresh choices file, not paused'
            $n = [int][regex]::Match(($f -match '^free: ')[0], '(\d+)$').Value
            $a = Rect ($f -match '^area: ')[0] 'area: '
            foreach ($name in 'tile-columns', 'tile-rows', 'cascade-all', 'reverse-all', 'fit-channel') {
              Expect $f "^${name}: ran true$" "$name ran through the action runner"
            }
            Expect $f '^cycle bound: true$' 'cycle-stacked-windows bound to Ctrl+Alt+Shift+P'
            Expect $f '^cycle-stacked-windows: pressed true$' 'the cycle shortcut press reached the probe'
            $start = Frames $f 'start'
            $cols = Frames $f 'tile-columns'
            foreach ($r in $cols.Values) {
              if ([Math]::Abs($r[2] - $a[2] / $n) -gt 1 -or [Math]::Abs($r[1] - $a[1]) -gt 1 -or [Math]::Abs($r[3] - $a[3]) -gt 1) { throw "a column is $($r -join ' '), want one of $n equal columns of $($a -join ' ')" }
            }
            if ($n -eq 3) {
              $xs = @($cols.Values | Sort-Object { $_[0] })
              if ([Math]::Abs($xs[0][0] - $a[0]) -gt 1 -or [Math]::Abs($xs[2][0] + $xs[2][2] - $a[0] - $a[2]) -gt 1) { throw "three columns are not flush with the area $($a -join ' ')" }
            }
            foreach ($r in (Frames $f 'tile-rows').Values) {
              if ([Math]::Abs($r[3] - $a[3] / $n) -gt 1 -or [Math]::Abs($r[0] - $a[0]) -gt 1 -or [Math]::Abs($r[2] - $a[2]) -gt 1) { throw "a row is $($r -join ' '), want one of $n equal rows of $($a -join ' ')" }
            }
            $step = [Math]::Min(30, [Math]::Min([Math]::Floor($a[2] / 2 / [Math]::Max(1, $n - 1)), [Math]::Floor($a[3] / 2 / [Math]::Max(1, $n - 1))))
            $seen = @()
            foreach ($r in (Frames $f 'cascade-all').Values) {
              $dx = $r[0] - $a[0]; $dy = $r[1] - $a[1]; $k = [Math]::Round($dx / $step)
              if ([Math]::Abs($dx - $dy) -gt 1 -or [Math]::Abs($dx - $k * $step) -gt 1 -or $k -lt 0 -or $k -ge $n) { throw "a cascaded window sits at $($r -join ' '), off the $step px steps from $($a[0]) $($a[1])" }
              $seen += $k
            }
            if (@($seen | Sort-Object -Unique).Count -ne 3) { throw "the cascade put two windows on one step: $($seen -join ' ')" }
            $before = [regex]::Match(($f -match '^front before: ')[0], '(0x[0-9a-f]+)$').Value
            $after = [regex]::Match(($f -match '^front after: ')[0], '(0x[0-9a-f]+|none)$').Value
            if (-not $start.Contains($before) -or -not $start.Contains($after) -or $before -eq $after) { throw "cycle-stacked-windows left $after in front, was $before" }
            $stacked = Frames $f 'stacked'
            $rev = Frames $f 'reverse-all'
            foreach ($k in $stacked.Keys) {
              $s = $stacked[$k]
              $want = @(($a[0] + $a[2] - ($s[0] - $a[0]) - $s[2]), $s[1], $s[2], $s[3])
              if ((Off $rev[$k] $want) -gt 1) { throw "reverse-all put $k at $($rev[$k] -join ' '), want the mirror $($want -join ' ')" }
            }
            $fit = @((Frames $f 'fit-channel').Values)
            foreach ($r in $fit) {
              if ($r[0] -lt $a[0] - 1 -or $r[1] -lt $a[1] - 1 -or $r[0] + $r[2] -gt $a[0] + $a[2] + 1 -or $r[1] + $r[3] -gt $a[1] + $a[3] + 1) { throw "fit-channel put a window at $($r -join ' '), outside $($a -join ' ')" }
            }
            $cap = [int][regex]::Match(($f -match '^fit capacity: ')[0], '(\d+)$').Value
            if ($cap -ge $n) { foreach ($i in 0..($fit.Count - 2)) {
              foreach ($j in ($i + 1)..($fit.Count - 1)) {
                $p = $fit[$i]; $q = $fit[$j]
                $ox = [Math]::Min($p[0] + $p[2], $q[0] + $q[2]) - [Math]::Max($p[0], $q[0])
                $oy = [Math]::Min($p[1] + $p[3], $q[1] + $q[3]) - [Math]::Max($p[1], $q[1])
                if ($ox -gt 1 -and $oy -gt 1) { throw "fit-channel overlapped $($p -join ' ') and $($q -join ' ')" }
              }
            } }
            $halves = @((Frames $f 'tidy-2').Values | Where-Object { [Math]::Abs($_[2] - $a[2] / 2) -le 1 -and [Math]::Abs($_[3] - $a[3]) -le 1 -and [Math]::Abs($_[1] - $a[1]) -le 1 })
            if ($n -eq 3 -and $halves.Count -ne 2) { throw "Tidy 2 front windows gave $($halves.Count) windows half the area, want 2" }
            Same $start (Frames $f 'undo') 'Undo tidy left a window off its start'
            Write-Host "  check: $n free windows, columns and rows of $($a -join ' '), cascade step $step, cycle $before to $after, mirror, fit inside $($a -join ' ') with $cap cells, Tidy 2 halves $($halves.Count), undo back to the start"

            Write-Host "probe organize --paused $geo"
            $f = Probe (@('--probe', 'organize', '--paused') + $geo)
            Expect $f '^paused: true$' 'a paused choices file'
            foreach ($name in 'tile-columns', 'tile-rows', 'cascade-all', 'reverse-all', 'fit-channel') {
              Expect $f "^${name}: ran false$" "$name refused while paused"
            }
            Expect $f '^cycle-stacked-windows: pressed true$' 'the cycle shortcut press reached the probe while paused'
            $start = Frames $f 'start'
            foreach ($label in 'tile-columns', 'tile-rows', 'cascade-all') { Same $start (Frames $f $label) "$label moved a window while paused" }
            $stacked = Frames $f 'stacked'
            foreach ($label in 'cycle-stacked-windows', 'reverse-all', 'fit-channel', 'tidy-2', 'undo') { Same $stacked (Frames $f $label) "$label moved a window while paused" }
            $before = [regex]::Match(($f -match '^front before: ')[0], '(0x[0-9a-f]+)$').Value
            Expect $f "^front after: $before$" 'the front window unchanged while paused'
            Write-Host "  check: paused, every organize action refused and no window moved, so the frame checks read real moves"
            $pads | ForEach-Object { Stop-Process -Id $_.Id -ErrorAction SilentlyContinue }
          }
          OrganizeCheck @('--min-aspect', '1.0')

          function BadgeCheck([string[]] $geo) {
            Write-Host "probe badge $geo"
            $pads = @(1..3 | ForEach-Object { Pad })
            Start-Sleep -Seconds 3
            $f = Probe (@('--probe', 'badge') + $geo)
            Expect $f '^pads: 3$' 'three windows of the app to stack'
            Expect $f '^ticking: true$' 'the badge ticks with stacking.badge on'
            $front = Rect ($f -match '^front: ')[0] 'front: '
            $m = [regex]::Match(($f -match '^rest: ')[0], '^rest: (\d+) at (-?\d+ -?\d+ \d+ \d+)$')
            if (-not $m.Success) { throw "no badge while the pointer rested at the front corner: $(($f -match '^rest: ')[0])" }
            if ([int]$m.Groups[1].Value -ne 3) { throw "the badge counts $($m.Groups[1].Value), want 3" }
            if ((Off $front ($m.Groups[2].Value -split ' ' | ForEach-Object { [int]$_ })) -gt 1) { throw "the badge sits on $($m.Groups[2].Value), not the front window $($front -join ' ')" }
            $line = ($f -match '^rest window: ')[0]
            $b = Rect $line 'rest window: '
            $scale = [double][regex]::Match($line, 'scale ([\d.]+)$').Groups[1].Value
            if (-not ($line -match ' visible true scale ')) { throw "the badge window is not visible: $line" }
            $px = { param($p) [int][Math]::Round($p * $scale) }
            $want = @(($front[0] + $front[2] - (& $px 30) - (& $px 8)), ($front[1] + (& $px 8)), (& $px 30), (& $px 22))
            if ((Off $b $want) -gt 1) { throw "the badge window is at $($b -join ' '), want the front window's top-right corner $($want -join ' ')" }
            Expect $f '^away: none$' 'the badge hid when the pointer moved off the corner'
            Expect $f '^away window: .* visible false ' 'the badge window hidden after the move'
            Write-Host "  check: the badge counted 3 stacked windows at $($b -join ' ') on the front window's corner and hid when the pointer moved away"

            Write-Host "probe badge --no-badge $geo"
            $f = Probe (@('--probe', 'badge', '--no-badge') + $geo)
            Expect $f '^ticking: false$' 'the badge stays off with stacking.badge off'
            Expect $f '^rest: none$' 'no badge on the same stack with stacking.badge off'
            Write-Host "  check: with stacking.badge off the same stack shows no badge, so the check can fail"
            $pads | ForEach-Object { Stop-Process -Id $_.Id -ErrorAction SilentlyContinue }
          }
          BadgeCheck @('--min-aspect', '1.0')

          # Gap reads a "label: want x y w h got x y w h" line and returns how far apart the two are.
          function Gap([string] $line, [string] $label) {
            $m = [regex]::Match($line, "^${label}: want (-?\d+ -?\d+ \d+ \d+) got (-?\d+ -?\d+ \d+ \d+)$")
            if (-not $m.Success) { throw "unreadable $label line: $line" }
            Off ($m.Groups[1].Value -split ' ' | ForEach-Object { [int]$_ }) ($m.Groups[2].Value -split ' ' | ForEach-Object { [int]$_ })
          }
          # PadsAt judges every window line under label: on its saved frame within 1 px when $on, else
          # more than 1 px off it, and returns how many it read.
          function PadsAt($lines, [string] $label, [bool] $on) {
            $rows = @($lines -match "^$label 0x")
            if ($rows.Count -lt 1) { throw "no $label lines" }
            foreach ($l in $rows) {
              $off = Gap $l "$label 0x[0-9a-f]+"
              if ($on -and $off -gt 1) { throw "${label}: a window is $off px off its saved frame: $l" }
              if (-not $on -and $off -le 1) { throw "${label}: a window sits on its saved frame: $l" }
            }
            $rows.Count
          }

          # Custom sizes: the tray folder lists both sizes, each lands on the engine's frame for it with
          # a 12 px gap, and the control with no gap moves Quarter's left and top edges by the whole gap.
          function SizesCheck([string[]] $geo) {
            Write-Host "probe sizes $geo"
            $pad = Pad
            Start-Sleep -Seconds 3
            $f = Probe (@('--probe', 'sizes') + $geo)
            Expect $f '^menu \[ \] Custom sizes$' 'the Custom sizes folder'
            Expect $f '^menu   \[ \] Quarter$' 'Quarter under Custom sizes'
            Expect $f '^menu   \[ \] Note$' 'Note under Custom sizes'
            foreach ($label in 'Quarter', 'Note', 'nogap Quarter') {
              $line = ($f -match "^${label}: ")[0]
              $off = Gap $line $label
              if ($off -gt 1) { throw "$label landed $off px off the engine's frame: $line" }
            }
            $gap = Rect ($f -match '^Quarter: ')[0] ' got '
            $none = Rect ($f -match '^nogap Quarter: ')[0] ' got '
            foreach ($i in 0, 1) {
              if ([Math]::Abs($gap[$i] - $none[$i] - 12) -gt 1) { throw "the 12 px gap moved Quarter's edge $i from $($none[$i]) to $($gap[$i]), not by 12" }
            }
            Write-Host "  check: the folder lists both sizes, each landed on the engine's frame, and the gap moved Quarter from $($none -join ' ') to $($gap -join ' ')"
            Stop-Process -Id $pad.Id -ErrorAction SilentlyContinue
          }
          SizesCheck @('--min-aspect', '1.0')

          function WorkspaceCheck([string[]] $geo, [bool] $tie) {
            $extra = if ($tie) { @('--tie') } else { @() }
            Write-Host "probe workspace $geo $extra"
            $pads = @(1..2 | ForEach-Object { Pad })
            Start-Sleep -Seconds 3
            $f = Probe (@('--probe', 'workspace') + $geo + $extra)
            Expect $f '^pads: 2$' 'two windows of the app'
            Expect $f '^name: Workspace 1$' 'the first free name on a fresh choices file'
            Expect $f '^saved: \d+ pads 2$' 'both windows saved in the workspace'
            Expect $f '^recalled: true$' 'the workspace recalled'
            $n = PadsAt $f 'pad' $true
            Expect $f '^menu \[ \] Workspaces$' 'the Workspaces folder'
            Expect $f '^menu   \[ \] Workspace 1$' 'the saved workspace listed'
            Expect $f '^menu     \[ \] Recall with these displays$' 'untied before the tie'
            Write-Host "  check: $n windows saved as Workspace 1, moved away and recalled onto their saved frames within 1 px"
            if ($tie) {
              Expect $f '^tied: true$' 'the workspace tied to the fake monitor'
              Expect $f '^menu     \[x\] Recall with these displays$' 'Recall with these displays checked once tied'
              $own = [regex]::Match(($f -match '^own displays: ')[0], '^own displays: (.+)$').Groups[1].Value
              $other = [regex]::Match(($f -match '^other displays: ')[0], '^other displays: (.+)$').Groups[1].Value
              if (-not $own -or $own -eq $other) { throw "the two display sets share the key '$own'" }
              $null = PadsAt $f 'other' $false
              $null = PadsAt $f 'back' $true
              Write-Host "  check: tied to $own, nothing came back on $other, and the workspace came back by itself on its own displays"
            }
            $pads | ForEach-Object { Stop-Process -Id $_.Id -ErrorAction SilentlyContinue }
          }
          WorkspaceCheck @('--min-aspect', '1.0') $false

          Write-Host "probe workspace --launch"
          $null = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          $f = Probe @('--probe', 'workspace', '--launch', '--min-aspect', '1.0')
          Expect $f '^opens missing: true$' 'Open apps that are not running set on every saved window'
          Expect $f '^closed: true$' 'every Notepad closed before the recall'
          Expect $f '^recalled: true$' 'the workspace recalled'
          Expect $f '^launched: 0x' 'the recall opened Notepad'
          $off = Gap (($f -match '^launch: ')[0]) 'launch'
          if ($off -gt 1) { throw "the window the recall opened is $off px off its saved frame" }
          Write-Host "  check: the recall opened Notepad by its exe path and put its window on the saved frame"
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue

          function AppRule([string[]] $extra) {
            Write-Host "probe apprule $extra"
            $null = Start-Process notepad -PassThru
            Start-Sleep -Seconds 3
            $f = Probe (@('--probe', 'apprule', '--min-aspect', '1.0') + $extra)
            Expect $f '^closed: true$' 'every Notepad closed before the reopen'
            Expect $f '^opened: true$' 'Notepad opened by its exe path through ShellExecuteW'
            Expect $f '^shown: 0x' 'the reopened Notepad showed a window'
            $off = Gap (($f -match '^landed: ')[0]) 'landed'
            Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
            [pscustomobject]@{ Lines = $f; Off = $off }
          }
          $none = AppRule @('--no-rule')
          Expect $none.Lines '^rule: false$' 'no rule in the control'
          if ($none.Off -le 1) { throw "with no rule Notepad still landed on the rule's frame, so the check cannot fail" }
          $ruled = AppRule @()
          Expect $ruled.Lines '^rule: true$' 'the rule saved'
          if ($ruled.Off -gt 1) { throw "the ruled Notepad is $($ruled.Off) px off its rule's frame" }
          Write-Host "  check: with the rule Notepad's first window took its frame, and with no rule it landed $($none.Off) px away"

          Write-Host "probe footprint"
          $pad = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          $null = Probe @('--probe', 'nudge', '--pid', "$($pad.Id)", '--frame', '200,150,500,350')
          $f = Probe @('--probe', 'footprint', '--frame', '250,200,300,200')
          $padId = [regex]::Match(($f -match '^foreground before: ')[0], 'notepad (0x[0-9a-f]+)$').Groups[1].Value
          Expect $f "^foreground before: $padId notepad $padId$" 'Notepad in front before the footprint'
          if ((Off (Rect ($f -match '^rect: ')[0] 'rect: ') @(250, 200, 300, 200)) -gt 1) { throw "the footprint is not at the asked frame" }
          Expect $f '^exstyle: transparent true noactivate true layered true topmost true toolwindow true$' 'the footprint style bits'
          Expect $f '^visible: true$' 'the footprint shown'
          Expect $f "^foreground after show: $padId$" 'showing the footprint left Notepad in front'
          Expect $f "^foreground after click: $padId footprint " 'a click on the footprint went through to Notepad'
          Expect $f '^visible after hide: false$' 'the footprint hidden'
          Write-Host "  check: footprint at 250 200 300 200, pass-through, Notepad kept the foreground through the show and a click"

          Write-Host "probe footprint --activate"
          $f = Probe @('--probe', 'footprint', '--frame', '250,200,300,200', '--activate')
          Expect $f '^exstyle: transparent false noactivate false ' 'the negative control without the pass-through bits'
          $foot = [regex]::Match(($f -match '^foreground after click: ')[0], 'footprint (0x[0-9a-f]+)$').Groups[1].Value
          Expect $f "^foreground after click: $foot footprint $foot$" 'without the pass-through bits the click activated the footprint'
          Write-Host "  check: without the pass-through bits a click took the foreground, so the check can fail"
          Stop-Process -Id $pad.Id

          Write-Host "SIM: the runner as a 3440x1440 ultrawide"
          $modes = Probe @('--probe', 'modes')
          $big = @($modes -match '^mode \d+x\d+ ' | ForEach-Object {
            $n = [regex]::Match($_, '^mode (\d+)x(\d+) ')
            [pscustomobject]@{ W = [int]$n.Groups[1].Value; H = [int]$n.Groups[2].Value }
          } | Where-Object { $_.W -ge 3440 -and $_.H -ge 1440 } | Sort-Object { $_.W * $_.H })
          $wideMode = [regex]::Match(($modes -match '^ultrawide mode: ')[0], '^ultrawide mode: (\S+)$').Groups[1].Value
          $switch = if ($big.Count -gt 0) { "$($big[0].W)x$($big[0].H)" } elseif ($wideMode -ne 'none') { $wideMode } else { $null }
          if ($switch) {
            Expect (Probe @('--probe', 'modes', '--mode', $switch)) '^switched to .*: done$' "the switch to $switch"
            $null = Probe @('--probe', 'modes')
          } else {
            Write-Host "  no display mode 21:9 or wider and none at 3440x1440 or larger: windows sit past the desktop"
          }
          $sim = @('--screen', '3440x1440')

          $m = Probe (@('--probe', 'monitors') + $sim)
          Expect $m '^monitor 0: full 0 0 3440 1440 usable 0 0 3440 1392 primary true$' 'one fake 3440x1440 monitor with a 48 px taskbar'
          Expect $m '^ultrawide: 0$' 'the fake monitor counts as the ultrawide at the default min aspect'

          $script:standIn = $true
          $simApp = $sim + @('--app', '\mooringswin.exe')

          StashCheck $simApp
          OrganizeCheck $simApp
          BadgeCheck $simApp
          SizesCheck $simApp
          WorkspaceCheck $simApp $true

          HotkeyCheck $simApp
          LinkCheck $simApp
          ButtonCheck $simApp
          if ($script:channel[2] -lt 1100) { throw "SIM channel is $($script:channel -join ' '), not at ultrawide numbers" }
          Write-Host "  check: SIM left half of the channel $($script:channel -join ' ')"

          Write-Host "SIM probe drag"
          $pad = Pad
          Start-Sleep -Seconds 3
          function Drag([string[]] $extra) {
            $null = Probe @('--probe', 'nudge', '--pid', "$($pad.Id)", '--frame', '200,150,500,350')
            Probe (@('--probe', 'drag', '--seconds', '4') + $simApp + $extra)
          }
          $d = Drag @()
          Expect $d '^hook reinstalled: 0$' 'the mouse hook was never put back'
          $channel = Rect ($d -match '^channel: ')[0] 'channel: '
          $half = @($channel[0], $channel[1], [Math]::Floor($channel[2] / 2), $channel[3])
          $d = Drag @('--no-hook')
          if ($d -match '^dropped ') { throw "a drag without the hook ran a drop" }
          if ((Off (Rect ($d -match '^after: ')[0] 'after: ') $half) -le 1) { throw "the stand-in reached the left half without the hook, so the drop is untested" }
          Write-Host "  check: without the hook no drop ran and the stand-in is off the left half"
          Stop-Process -Id $pad.Id
          $script:standIn = $false
          SkipCheck ($sim -join ' ')

          Write-Host "SIM normal host: --screen 1024x768 at the default min aspect"
          $small = @('--screen', '1024x768')
          $m = Probe (@('--probe', 'monitors') + $small)
          Expect $m '^ultrawide: none$' 'no ultrawide on a fake 4:3 screen'
          Expect $m '^host: 0 ultrawide false scale 1\.0$' 'the fake 4:3 screen hosts'
          function StripOf($lines) { Rect ($lines -match '^strip: ')[0] 'strip: ' }
          $pad = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          $n = Probe (@('--probe', 'moor', '--seconds', '3') + $small)
          $strip = StripOf $n
          if ($strip[2] -ne 512) { throw "a lone pin on a normal host took $($strip[2]), want half of 1024" }
          Expect $n '^waiting: none$' 'one side never waits'
          $final = @($n -match "^final \S+ pid $($pad.Id) frame ")[0]
          if ((Off (Rect $final 'frame ') $strip) -gt 1) { throw "Notepad did not reach the strip: $final" }
          Write-Host "  check: a lone pin on a normal host holds half of it"
          $n = Probe (@('--probe', 'moor', '--seconds', '3', '--min-aspect', '1.0') + $small)
          if ((StripOf $n)[2] -notin 409, 410) { throw "the same screen as an ultrawide took $((StripOf $n)[2]), want the saved 40 percent" }
          Write-Host "  check: the same screen as an ultrawide keeps the saved width, so half comes from the normal host"

          Write-Host "SIM normal host with both sides held"
          $script:standIn = $true
          $stand = Pad
          $script:standIn = $false
          Start-Sleep -Seconds 3
          function Both([string[]] $screen) { Probe (@('--probe', 'moor', '--seconds', '3', '--right', '\mooringswin.exe') + $screen) }
          $waits = '^notice: .*waits for a wider display: '
          $b = Both $small
          Expect $b '^waiting: right$' 'the right side waits on 1024'
          if (@($b -match $waits).Count -ne 1) { throw "want one waiting banner on 1024, got $(@($b -match $waits).Count)" }
          if ((StripOf $b)[2] -ne 512) { throw "the left side took $((StripOf $b)[2]) while the right waits, want 512" }
          Write-Host "  check: 1024 is too narrow, so the left holds half and one banner names the right app"
          $b = Both @('--screen', '2560x1440')
          Expect $b '^waiting: none$' 'both sides hold on 2560'
          if ($b -match $waits) { throw "a banner said the right side waits on 2560" }
          if ((StripOf $b)[2] -notin 844, 845) { throw "the left side took $((StripOf $b)[2]) on 2560, want a third" }
          Write-Host "  check: 2560 holds both at a third each with no banner"
          Expect (Both @('--screen', '2880x1920', '--scale', '2')) '^waiting: right$' 'the right side waits on 1440 points'
          Expect (Both @('--screen', '2880x1920')) '^waiting: none$' 'both sides hold on 2880 points'
          Write-Host "  check: 2880 pixels at 200 percent waits and at 100 percent holds both, so the fit reads points"
          Stop-Process -Id $stand.Id
          Stop-Process -Id $pad.Id

          Write-Host "SIM host follows the displays"
          $h = Probe @('--probe', 'host')
          Expect $h '^start: 0 0 1024 720 false 1\.0$' 'the first host key'
          Expect $h '^same: false$' 'an unchanged host is not a change'
          Expect $h '^other setting: 0 0 1024 720 false 1\.0 lifted true$' 'another setting change leaves the host alone'
          Expect $h '^work area: 0 0 2560 1392 false 1\.0 lifted false$' 'a work area change re-moors on the new host'
          Expect $h '^scale: 0 0 2560 1392 false 2\.0$' 'a scale change is a host change'
          Expect $h '^ultrawide: 0 0 3440 1392 true 1\.0$' 'an arriving ultrawide becomes the host'
          Write-Host "  check: the tray window's display messages move the host and re-moor, and other settings do not"
          if ($switch) { Expect (Probe @('--probe', 'modes', '--reset')) '^reset: done$' 'the display mode restored' }

      - name: Stop recording
        if: always()
        timeout-minutes: 2
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'probes'
          $stopped = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $state = Join-Path $dir 'recorder.txt'
          if (-not (Test-Path $state)) { throw "the Probe step started no recorder" }
          $id, $started = (Get-Content $state).Split(' ')
          . (Join-Path $dir 'recorder.ps1')
          $how = Stop-Recorder ([int]$id)
          "$started $stopped $how" | Set-Content $state
          Write-Host "  recorded: $([math]::Round(($stopped - [long]$started) / 1000.0, 1)) s, recorder $how at the stop"
          $err = Get-Content (Join-Path $dir 'probes.mp4.err') -Raw
          if ($err) { Write-Host "  recorder said: $err" }

      - name: Video check
        if: always()
        timeout-minutes: 2
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'probes'
          $file = Join-Path $dir 'probes.mp4'
          if (-not (Test-Path $file)) { throw "no probes.mp4 was written" }
          $started, $stopped, $how = (Get-Content (Join-Path $dir 'recorder.txt')).Split(' ')
          if (-not $how) { throw "the Stop recording step did not run" }
          . (Join-Path $dir 'recorder.ps1')
          $seconds = Test-Video $file
          $wall = ([long]$stopped - [long]$started) / 1000.0
          $mb = [math]::Round((Get-Item $file).Length / 1MB, 1)
          Write-Host "  video: $([math]::Round($seconds, 1)) s of $([math]::Round($wall, 1)) s recorded, $mb MB"
          if ([math]::Abs($wall - $seconds) -gt 10) { throw "the video lasts $seconds s, not within 10 s of the $wall s recorded" }
          if ($mb -gt 200) { throw "probes.mp4 is $mb MB, over the 200 MB bound" }
          Write-Host "  check: probes.mp4 plays for the length of the Probe step and is under 200 MB"

      - name: Probe video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probes-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/probes/probes.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Contracts
        timeout-minutes: 5
        run: |
          $exe = Join-Path (swift build -Xswiftc -warnings-as-errors --show-bin-path) 'MooringsWin.exe'
          $out = @(& $exe --probe contracts | ForEach-Object { $_ })
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "  $_" }
          if ($code -ne 0 -or -not ($out -match '^contracts: 14 suites, 0 failures$')) { throw "a Win32 adapter broke a contract rule ($code)" }
          Write-Host "  check: the Win32 adapters kept every WindowStore, Overlay, Badge, Notifier, Scheduler, Pointer, Keys, Log, Timers, EventSource, Apps, ScreenSource, ChoicesStore and Clock rule"

      - name: Report
        timeout-minutes: 5
        run: |
          $exe = Join-Path (swift build -Xswiftc -warnings-as-errors --show-bin-path) 'MooringsWin.exe'
          $log = Join-Path $env:LOCALAPPDATA 'Moorings\moorings.log'
          $n = if (Test-Path $log) { @(Get-Content $log).Count } else { 0 }
          if ($n -lt 1) { throw "the probes wrote no line to $log" }
          Write-Host "  check: the probes so far wrote $n lines to $log"

          $menu = @(& $exe --probe menu | ForEach-Object { $_ })
          if (-not ($menu -match '^menu \[ \] Save a report$')) { throw "the tray menu has no Save a report" }
          Write-Host "  check: the tray menu offers Save a report"

          $dir = Join-Path $env:RUNNER_TEMP 'report'
          $out = @(& $exe --probe report --report $dir | ForEach-Object { $_ })
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host "  $_" }
          if ($code -ne 0) { throw "the report probe exited $code" }
          $files = @(Get-ChildItem -Path $dir -Filter 'Moorings report *.txt')
          if ($files.Count -ne 1) { throw "want one report in $dir, got $($files.Count)" }
          $text = @(Get-Content $files[0].FullName)
          $text | Select-Object -First 16 | ForEach-Object { Write-Host "  | $_" }
          if (-not ($text -match '^version: ')) { throw "the report has no version line" }
          $monitors = @($text -match '^monitor: ').Count
          if ($monitors -lt 1) { throw "the report has no monitor line" }
          if (-not ($text -match '^host: ')) { throw "the report has no host line" }
          if (-not ($text -match '^log: ')) { throw "the report has no log section" }
          $given = [array]::IndexOf($text, 'shortcuts given up:')
          if ($given -lt 0) { throw "the report has no shortcuts given up section" }
          if ($text[$given + 1] -ne 'none') { throw "a report from a run that bound no shortcut gives up '$($text[$given + 1])'" }
          Write-Host "  check: the report names the version, $monitors monitor(s) and the log, and its shortcuts given up section reads none"

          Write-Host "report negative control: LOCALAPPDATA unset"
          $saved = $env:LOCALAPPDATA
          Remove-Item Env:LOCALAPPDATA
          $out = @(& $exe --probe report --report $dir | ForEach-Object { $_ })
          $code = $LASTEXITCODE
          $env:LOCALAPPDATA = $saved
          $global:LASTEXITCODE = 0
          $out | ForEach-Object { Write-Host "  $_" }
          if ($code -eq 0 -or -not ($out -match '^report: no LOCALAPPDATA$')) { throw "the report ran with no LOCALAPPDATA ($code)" }
          Write-Host "  check: with no LOCALAPPDATA the report refuses and names why"

          Write-Host "log rotation: a log past 1 MB moves aside on the next line"
          $roll = Join-Path $env:RUNNER_TEMP 'logroll'
          New-Item -ItemType Directory -Force -Path (Join-Path $roll 'Moorings') | Out-Null
          $fill = Join-Path $roll 'Moorings\moorings.log'
          $line = ('x' * 99) + "`n"
          [IO.File]::WriteAllText($fill, ($line * 10486) + $line)
          $before = (Get-Item $fill).Length
          $env:LOCALAPPDATA = $roll
          $out = @(& $exe --probe report --report (Join-Path $env:RUNNER_TEMP 'report-roll') | ForEach-Object { $_ })
          $code = $LASTEXITCODE
          $env:LOCALAPPDATA = $saved
          $out | ForEach-Object { Write-Host "  $_" }
          if ($code -ne 0) { throw "the rotation report exited $code" }
          $older = Join-Path $roll 'Moorings\moorings.log.1'
          if (-not (Test-Path $older) -or (Get-Item $older).Length -ne $before) { throw "the $before byte log did not move to moorings.log.1" }
          $fresh = @(Get-Content $fill)
          if ($fresh.Count -lt 1 -or (Get-Item $fill).Length -ge 4096) { throw "the new moorings.log holds $((Get-Item $fill).Length) bytes, not the one new line" }
          Write-Host "  check: the $before byte log moved to moorings.log.1 and moorings.log started over with $($fresh.Count) line(s)"

      - name: Scenarios
        timeout-minutes: 20
        run: |
          $exe = Join-Path (swift build -Xswiftc -warnings-as-errors --show-bin-path) 'MooringsWin.exe'
          function Scenarios([string] $name, [string[]] $more) {
            $dir = Join-Path $env:RUNNER_TEMP "scenarios\$name"
            $out = @(& $exe (@('--scenarios') + $more + @('--report', $dir)) | ForEach-Object { $_ })
            $code = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            $out | ForEach-Object { Write-Host "  $_" }
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $sum = @($out -match '^scenarios: ')[0]
            if (-not $sum) { $sum = 'scenarios: no summary' }
            Set-Content -Path (Join-Path $dir 'result.txt') -Value @("exit $code", $sum) -Encoding utf8
            [pscustomobject]@{ Lines = $out; Code = $code; Dir = $dir }
          }
          function Written($run) {
            $shots = @(Get-ChildItem (Join-Path $run.Dir '*.png') -ErrorAction SilentlyContinue)
            if (-not (Test-Path (Join-Path $run.Dir 'report.html')) -or $shots.Count -ne 17) { throw "want report.html and 17 pictures in $($run.Dir), got $($shots.Count)" }
            if (-not ($run.Lines -match '^hook reinstalled: 0$')) { throw "the mouse hook was put back during the scenarios in $($run.Dir)" }
          }

          Write-Host "scenarios on the runner's screen"
          $s = Scenarios 'runner' @('--min-aspect', '1.0')
          if ($s.Code -ne 0 -or -not ($s.Lines -match '^scenarios: 17 run, 2 skipped, 0 failed$')) { throw "a scenario failed on the Win32 adapters ($($s.Code))" }
          Written $s
          Write-Host "  check: 17 scenarios passed on the Win32 adapters, channelCycle and refusedWindowTriedOnce skipped, with report.html, 17 pictures and the hook never put back"

          Write-Host "scenarios on a fake 3440x1440 ultrawide"
          $s = Scenarios 'sim' @('--screen', '3440x1440')
          if ($s.Code -ne 0 -or -not ($s.Lines -match '^scenarios: 17 run, 2 skipped, 0 failed$')) { throw "a scenario failed on the fake ultrawide ($($s.Code))" }
          if (-not ($s.Lines -match '^scenario pinPlacesOnStrip frame strip: 0 0 1376 1392$')) { throw "SIM strip is not the left 40 percent of 3440x1392" }
          Written $s
          Write-Host "  check: SIM pin held at the 3440x1440 left strip 0 0 1376 1392 and every scenario passed there"
          $html = Get-Content -Raw (Join-Path $s.Dir 'report.html')
          if (-not $html.Contains('<rect data-name="strip" x="0" y="0" width="1376" height="1392">')) { throw "the SIM report draws no strip box at 0 0 1376 1392" }
          $ch = ($s.Lines -match '^scenario dragSnapsToZone frame channel: ')[0]
          if (-not $ch) { throw "the SIM drag scenario printed no channel" }
          $n = ($ch -replace '^scenario dragSnapsToZone frame channel: ', '').Split(' ')
          if (-not $html.Contains("<rect data-name=`"channel`" x=`"$($n[0])`" y=`"$($n[1])`" width=`"$($n[2])`" height=`"$($n[3])`">")) { throw "the SIM report's channel box is not the printed channel $($n -join ' ')" }
          Write-Host "  check: the SIM report draws the strip at 0 0 1376 1392 and the channel at $($n -join ' ') as printed"

          Write-Host "scenarios negative control: the strip expected 2 px wider"
          $s = Scenarios 'skew' @('pinPlacesOnStrip', '--skew', '2', '--min-aspect', '1.0')
          if ($s.Code -eq 0 -or -not ($s.Lines -match '^scenario failed: pinPlacesOnStrip: a pinned window reads back at its strip within 2 s, 1 point: ')) { throw "a strip 2 px off passed, so the pin scenario cannot fail" }
          Write-Host "  check: a strip expected 2 px wider failed the pin scenario with its rule named"

          Write-Host "browsers as stand-ins: pin, push to the channel and drag snap on custom-frame windows"
          $paths = [ordered]@{
            chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
            edge = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe")
            firefox = @("$env:ProgramFiles\Mozilla Firefox\firefox.exe", "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe")
          }
          $browsers = [ordered]@{}
          foreach ($b in $paths.Keys) {
            $hit = @($paths[$b] | Where-Object { Test-Path $_ })[0]
            if ($hit) { $browsers[$b] = (Get-Item $hit).FullName }
          }
          $browsers.GetEnumerator() | ForEach-Object { Write-Host "  browser on the runner: $($_.Key) $($_.Value)" }
          if ($browsers.Count -eq 0) { throw "no Chrome, Edge or Firefox on the runner" }
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name HideFirstRunExperience -Value 1 -Type DWord
          $modes = @(& $exe --probe modes | ForEach-Object { $_ })
          $global:LASTEXITCODE = 0
          $mode = if ($modes -match '^mode 1920x1080 ') { '1920x1080' } else { $null }
          if ($mode) {
            $m = @(& $exe --probe modes --mode $mode | ForEach-Object { $_ })
            $global:LASTEXITCODE = 0
            if (-not ($m -match '^switched to .*: done$')) { throw "the switch to $mode failed: $($m -join ' ')" }
          }
          Write-Host "  screen: $(@(& $exe --probe modes | ForEach-Object { $_ }) -match '^current: ')"
          $global:LASTEXITCODE = 0
          Write-Host "caption answers by window kind, a read and not a check: any answer but a button keeps its native clicks"
          foreach ($b in @('chrome', 'edge')) {
            if ($browsers[$b]) { $null = Start-Process $browsers[$b] -ArgumentList @("--user-data-dir=$(Join-Path $env:RUNNER_TEMP "captions-$b")", '--no-first-run', '--no-default-browser-check', '--disable-extensions', '--new-window', 'about:blank') -PassThru; Start-Sleep -Seconds 6 }
          }
          try { $null = Start-Process calc -PassThru } catch { Write-Host "  no calculator on the runner" }
          Start-Sleep -Seconds 8
          & $exe --probe captions --min-aspect 1.0 | ForEach-Object { Write-Host "  $_" }
          if ($LASTEXITCODE -ne 0) { throw "probe captions exited $LASTEXITCODE" }
          foreach ($b in @('chrome', 'edge')) {
            if ($browsers[$b]) { Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $browsers[$b] } | Stop-Process -Force -ErrorAction SilentlyContinue }
          }
          Get-Process -Name calc, win32calc, CalculatorApp -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $bad = @()
          $controls = 0
          try {
            foreach ($b in $browsers.Keys) {
              $s = Scenarios "browser-$b" @('pinPlacesOnStrip', 'secondWindowGoesToChannel', 'dragSnapsToZone', '--stand-in', $browsers[$b], '--min-aspect', '1.0')
              Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $browsers[$b] } | Stop-Process -Force -ErrorAction SilentlyContinue
              if ($s.Code -ne 0 -or -not ($s.Lines -match '^scenarios: 3 run, 0 failed$')) { $bad += "$b ($($s.Code))" }
              $ins = [regex]::Match((@($s.Lines -match '^stand-in insets: ')[0] + ''), '^stand-in insets: (\d+) (\d+) (\d+) (\d+)$')
              if (-not $ins.Success) { $bad += "$b printed no insets"; continue }
              $sum = 0; 1..4 | ForEach-Object { $sum += [int]$ins.Groups[$_].Value }
              if ($sum -eq 0) { Write-Host "  $b has no inset, so the border correction changes nothing on it"; continue }
              $n = Scenarios "nodelta-$b" @('pinPlacesOnStrip', '--no-delta', '--stand-in', $browsers[$b], '--min-aspect', '1.0')
              Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $browsers[$b] } | Stop-Process -Force -ErrorAction SilentlyContinue
              if ($n.Code -eq 0 -or -not ($n.Lines -match '^scenario failed: pinPlacesOnStrip: a pinned window reads back at its strip within 2 s, 1 point: ')) { $bad += "$b without the correction passed" } else { $controls++ }
            }
          } finally {
            if ($mode) {
              $null = & $exe --probe modes --reset | ForEach-Object { $_ }
              $global:LASTEXITCODE = 0
            }
          }
          if ($bad.Count -ne 0) { throw "browser stand-ins failed: $($bad -join ', ')" }
          if ($controls -eq 0) { throw "no browser has an inset, so the border correction cannot fail on any" }
          Write-Host "  check: $($browsers.Keys -join ', ') pinned, pushed and snapped within 1 px, and $controls without the border correction missed the strip"

      - name: SIM repeat
        if: github.event_name == 'workflow_dispatch' && inputs.sim_repeat > 1
        timeout-minutes: 45
        env:
          SIM_REPEAT: ${{ inputs.sim_repeat }}
        run: |
          $exe = Join-Path (swift build -Xswiftc -warnings-as-errors --show-bin-path) 'MooringsWin.exe'
          $n = [int]$env:SIM_REPEAT
          $failed = 0
          for ($i = 1; $i -le $n; $i++) {
            $dir = Join-Path $env:RUNNER_TEMP "sim-repeat\$i"
            $out = @(& $exe --scenarios --screen 3440x1440 --report $dir | ForEach-Object { $_ })
            $code = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            $sum = @($out -match '^scenarios: ')[0]
            $hook = @($out -match '^hook reinstalled: ')[0]
            Write-Host "  SIM run $i of ${n}: $sum, $hook, exit $code"
            $out -match '^scenario failed: ' | ForEach-Object { Write-Host "    $_" }
            if ($code -ne 0 -or $sum -ne 'scenarios: 17 run, 2 skipped, 0 failed' -or $hook -ne 'hook reinstalled: 0') { $failed++ }
          }
          if ($failed -ne 0) { throw "$failed of $n SIM runs failed" }
          Write-Host "  check: $n SIM runs in a row passed every scenario with the hook never put back"

      - name: Scenario index
        if: always()
        timeout-minutes: 2
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'scenarios'
          $runs = @(Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Sort-Object Name)
          $rows = foreach ($r in $runs) {
            $file = Join-Path $r.FullName 'result.txt'
            $summary = 'no result'
            $exit = 'none'
            if (Test-Path $file) {
              $lines = @(Get-Content $file)
              $exit = ($lines[0] -replace '^exit ', '')
              $summary = $lines[1]
            }
            $pngs = @(Get-ChildItem (Join-Path $r.FullName '*.png') -ErrorAction SilentlyContinue).Count
            $ok = $false
            if ($r.Name -eq 'skew' -or $r.Name -like 'nodelta-*') {
              if ($exit -ne 'none' -and $exit -ne '0') { $ok = $true; $verdict = 'failed, as the negative control must' }
              else { $verdict = 'PASSED, the negative control is broken' }
            } else {
              if ($exit -eq '0') { $ok = $true; $verdict = 'passed' }
              else { $verdict = 'FAILED' }
            }
            $state = if ($ok) { 'pass' } else { 'fail' }
            $n = [System.Net.WebUtility]::HtmlEncode($r.Name)
            $link = [System.Net.WebUtility]::HtmlEncode("$($r.Name)/report.html")
            $sm = [System.Net.WebUtility]::HtmlEncode($summary)
            $ex = [System.Net.WebUtility]::HtmlEncode($exit)
            $vd = [System.Net.WebUtility]::HtmlEncode($verdict)
            "<tr data-run=`"$n`" data-verdict=`"$state`"><td><a href=`"$link`">$n</a></td><td>$sm</td><td>$ex</td><td>$pngs</td><td>$vd</td></tr>"
          }
          $page = @('<!doctype html>', '<html><head><meta charset="utf-8"><title>Moorings scenarios</title></head><body>', '<h1>Moorings scenarios</h1>',
            '<table border="1" cellpadding="6"><tr><th>Run</th><th>Summary</th><th>Exit</th><th>Pictures</th><th>Verdict</th></tr>') + @($rows) + @('</table>', '</body></html>')
          Set-Content -Path (Join-Path $root 'index.html') -Value $page -Encoding utf8
          $back = @(Get-Content (Join-Path $root 'index.html'))
          $listed = @($back -match '<tr data-run=')
          if ($listed.Count -ne $runs.Count) { throw "index.html lists $($listed.Count) rows for $($runs.Count) run folders" }
          $bad = @($listed -match 'data-verdict="fail"')
          if ($bad.Count -ne 0) {
            $bad | ForEach-Object { Write-Host "  $_" }
            throw "$($bad.Count) runs in index.html did not end as expected"
          }
          Write-Host "  check: index.html lists $($listed.Count) runs, every verdict as expected"

      - name: Scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/scenarios

      - name: Package
        id: package
        run: |
          $short = '${{ github.event.pull_request.head.sha || github.sha }}'.Substring(0, 7)
          ./package.ps1 -Name "moorings-windows-$short"

      - name: Package check
        timeout-minutes: 5
        run: |
          $dir = '${{ steps.package.outputs.dir }}'
          Get-ChildItem $dir | ForEach-Object { Write-Host "  $($_.Name)" }
          function Ran([string] $exe, [string] $log) {
            $p = Start-Process $exe -ArgumentList @('--probe', 'version') -RedirectStandardOutput $log -NoNewWindow -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; return 'hung' }
            "$($p.ExitCode)"
          }
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          if (Get-Command swift -ErrorAction SilentlyContinue) { throw "the toolchain is still on PATH" }
          $log = Join-Path $env:RUNNER_TEMP 'packaged.txt'
          $code = Ran (Join-Path $dir 'MooringsWin.exe') $log
          Get-Content $log | ForEach-Object { Write-Host "  $_" }
          if ($code -ne '0' -or -not (@(Get-Content $log) -match '^dpi: per-monitor-v2$')) { throw "the packaged exe did not run without the toolchain: $code" }
          $bare = Join-Path $env:RUNNER_TEMP 'bare'
          New-Item -ItemType Directory -Path $bare | Out-Null
          Copy-Item (Join-Path $dir 'MooringsWin.exe') $bare
          $code = Ran (Join-Path $bare 'MooringsWin.exe') (Join-Path $env:RUNNER_TEMP 'bare.txt')
          if ($code -eq '0') { throw "the exe ran with no runtime beside it, so the check proves nothing" }
          Write-Host "  check: packaged exe ran with the toolchain off PATH; the exe alone did not ($code)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.dir }}

      # The release workflow's windows job, run here with a made-up version so a release never runs
      # it first: stamp, package as Moorings, the exe says the version with the toolchain off PATH,
      # and the zip holds the Moorings folder. Last, since it rewrites Version.swift in the checkout.
      - name: Release package
        timeout-minutes: 20
        run: |
          ./package.ps1 -Name Moorings -Version 9.9.8
          $dir = Join-Path $env:RUNNER_TEMP 'Moorings'
          $zip = Join-Path $env:RUNNER_TEMP 'moorings_v9.9.8_windows_x64.zip'
          Compress-Archive -Path $dir -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = @([IO.Compression.ZipFile]::OpenRead($zip).Entries.FullName)
          if (-not ($entries -match '^Moorings[\\/]MooringsWin\.exe$')) { throw "the zip does not hold Moorings\MooringsWin.exe: $($entries -join ', ')" }
          $saved = $env:Path
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          $log = Join-Path $env:RUNNER_TEMP 'release-version.txt'
          $p = Start-Process (Join-Path $dir 'MooringsWin.exe') -ArgumentList @('--probe', 'version') -RedirectStandardOutput $log -NoNewWindow -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "the release exe hung" }
          $env:Path = $saved
          Get-Content $log | ForEach-Object { Write-Host "  $_" }
          if ($p.ExitCode -ne 0 -or -not (@(Get-Content $log) -contains 'version: 9.9.8')) { throw "the release exe did not say version: 9.9.8" }
          Write-Host "  check: the stamped exe says 9.9.8 and the zip holds the Moorings folder"

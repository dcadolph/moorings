name: release

# On a published release, build the universal app, sign it with Developer ID, notarize and staple
# it, wrap it in a signed, notarized disk image, attach the zip and the disk image, write the cask into dcadolph/homebrew-tap in place of the old formula, then
# install from the tap on macOS and check it the way a user would get it. The Windows zip is built
# on Windows with the tag's version and attached beside them, covered by the same signed checksums.
on:
  release:
    types: [published]

permissions:
  contents: write
  # Keyless signing and build provenance: the job's OIDC token mints the short-lived signing
  # certificate, and the attestation is stored against this repository.
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - uses: actions/checkout@v5

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
        working-directory: core

      - name: Package
        id: package
        run: ./package.ps1 -Name Moorings -Version $env:TAG.TrimStart('v')

      # The exe must run from the folder alone, with the toolchain off PATH, and say the tag's version.
      - name: Check the packaged exe
        timeout-minutes: 5
        run: |
          $dir = '${{ steps.package.outputs.dir }}'
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          if (Get-Command swift -ErrorAction SilentlyContinue) { throw "the toolchain is still on PATH" }
          $log = Join-Path $env:RUNNER_TEMP 'version.txt'
          $p = Start-Process (Join-Path $dir 'MooringsWin.exe') -ArgumentList @('--probe', 'version') -RedirectStandardOutput $log -NoNewWindow -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "the packaged exe hung" }
          Get-Content $log | ForEach-Object { Write-Host "  $_" }
          $want = "version: $($env:TAG.TrimStart('v'))"
          if ($p.ExitCode -ne 0 -or -not (@(Get-Content $log) -contains $want)) { throw "the packaged exe did not say $want" }

      - name: Zip
        run: |
          New-Item -ItemType Directory -Path ../dist | Out-Null
          Compress-Archive -Path '${{ steps.package.outputs.dir }}' -DestinationPath "../dist/moorings_$($env:TAG)_windows_x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/moorings_${{ github.event.release.tag_name }}_windows_x64.zip
          if-no-files-found: error

  build:
    needs: windows
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test --package-path ../core -Xswiftc -warnings-as-errors && swift build -Xswiftc -warnings-as-errors

      - name: Require signing secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. A release must be signed and notarized."
              exit 1
            fi
          done

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Build universal app
        env:
          # Tip link for the menu. A repository variable overrides the Sponsors page.
          MOORINGS_SUPPORT_URL: ${{ vars.MOORINGS_SUPPORT_URL || 'https://github.com/sponsors/dcadolph' }}
          SIGN_ID: "Developer ID Application: Douglas Adolph (U7L4P2YHWJ)"
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          make zip ARCHS="arm64 x86_64" SIGN_ID="$SIGN_ID" VERSION="${TAG#v}" BUILD="${GITHUB_RUN_NUMBER}" \
            ZIP="../dist/moorings_${TAG}_macos_universal.zip"
          codesign -dv .build/Moorings.app 2>&1 | tee "$RUNNER_TEMP/sign.txt"
          grep -q "TeamIdentifier=U7L4P2YHWJ" "$RUNNER_TEMP/sign.txt"
          grep -q "flags=0x10000(runtime)" "$RUNNER_TEMP/sign.txt"

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          zip="../dist/moorings_${TAG}_macos_universal.zip"
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$key"
          xcrun notarytool submit "$zip" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 180m --output-format json > "$RUNNER_TEMP/notary.json"
          rm -f "$key"
          cat "$RUNNER_TEMP/notary.json"
          test "$(jq -r .status "$RUNNER_TEMP/notary.json")" = "Accepted"
          # stapler staple fetches the ticket from Apple, so retry a dropped connection.
          for try in 1 2 3; do
            xcrun stapler staple .build/Moorings.app && break
            test "$try" -lt 3
            sleep 30
          done
          rm -f "$zip"
          ditto -c -k --keepParent .build/Moorings.app "$zip"

      - name: Build, notarize and staple the disk image
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SIGN_ID: "Developer ID Application: Douglas Adolph (U7L4P2YHWJ)"
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.6
          dmg="../dist/moorings_${TAG}_macos_universal.dmg"
          make dmg DMGBUILD="$RUNNER_TEMP/dmgbuild/bin/dmgbuild" DMG="$dmg" SIGN_ID="$SIGN_ID"
          codesign -dv "$dmg" 2>&1 | grep -q "TeamIdentifier=U7L4P2YHWJ"
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 180m --output-format json > "$RUNNER_TEMP/notary-dmg.json"
          rm -f "$key"
          cat "$RUNNER_TEMP/notary-dmg.json"
          test "$(jq -r .status "$RUNNER_TEMP/notary-dmg.json")" = "Accepted"
          for try in 1 2 3; do
            xcrun stapler staple "$dmg" && break
            test "$try" -lt 3
            sleep 30
          done

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      - name: Verify as a user would
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/verify"
          mkdir -p "$check"
          ditto -x -k "../dist/moorings_${TAG}_macos_universal.zip" "$check"
          # stapler validate asks Apple's ticket service, so retry a dropped connection.
          for try in 1 2 3; do
            xcrun stapler validate "$check/Moorings.app" && break
            test "$try" -lt 3
            sleep 30
          done
          spctl --assess --type execute --verbose=4 "$check/Moorings.app"
          codesign --verify --deep --strict --verbose=2 "$check/Moorings.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$check/Moorings.app/Contents/Info.plist")" = "${TAG#v}"
          dmg="../dist/moorings_${TAG}_macos_universal.dmg"
          for try in 1 2 3; do
            xcrun stapler validate "$dmg" && break
            test "$try" -lt 3
            sleep 30
          done
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          mount="$RUNNER_TEMP/dmg-mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          spctl --assess --type execute --verbose=4 "$mount/Moorings.app"
          test "$(readlink "$mount/Applications")" = "/Applications"
          test -f "$mount/.DS_Store"
          hdiutil detach "$mount"
          cd ../dist
          # Fixed names let releases/latest/download/moorings_macos_universal.{zip,dmg} always work.
          cp -- "moorings_${TAG}_macos_universal.zip" moorings_macos_universal.zip
          cp -- "moorings_${TAG}_macos_universal.dmg" moorings_macos_universal.dmg
          cp -- "moorings_${TAG}_windows_x64.zip" moorings_windows_x64.zip
          shasum -a 256 -- *.zip *.dmg > SHA256SUMS

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # One keyless signature over SHA256SUMS covers the zip and the disk image through their
      # checksums. It is verified at once with the identity check a downloader would run.
      - name: Sign the checksums
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob --yes SHA256SUMS --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem
          cosign verify-blob SHA256SUMS --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \
            --certificate-identity-regexp '^https://github.com/dcadolph/moorings/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          shasum -a 256 -c SHA256SUMS

      # SLSA build provenance for the zip and the disk image, checkable with gh attestation verify.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  tap:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Write the cask into the tap
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set on this repository"
            exit 1
          fi
          VER="${TAG#v}"
          zip="moorings_${TAG}_macos_universal.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$zip"
          sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dcadolph/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/moorings.rb <<EOF
          cask "moorings" do
            version "${VER}"
            sha256 "${sha}"

            url "https://github.com/dcadolph/moorings/releases/download/v#{version}/moorings_v#{version}_macos_universal.zip"
            name "Moorings"
            desc "Snap windows with a key or a drag, and pin apps to ultrawide edges"
            homepage "https://github.com/dcadolph/moorings"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true

            depends_on macos: :sequoia

            app "Moorings.app"

            zap trash: "~/Library/Preferences/com.dcadolph.moorings.plist"
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The app replaces the Hammerspoon formula.
          if [ -f Formula/moorings.rb ]; then
            git rm -q Formula/moorings.rb
          fi
          git add Casks/moorings.rb
          # A re-run of a tag that already shipped writes the same cask and has nothing to push.
          if git diff --cached --quiet; then
            echo "the cask already holds ${VER}; nothing to bump"
            exit 0
          fi
          git commit -m "Update moorings to ${VER}"
          git push

  verify:
    needs: tap
    runs-on: macos-15
    # brew audit --online calls the GitHub API, and unauthenticated calls share the runner IP's
    # limit of 60 an hour.
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Install from the tap and check it as a user would
        run: |
          set -euo pipefail
          brew tap dcadolph/tap
          brew install --cask dcadolph/tap/moorings
          spctl --assess --type execute --verbose=4 /Applications/Moorings.app
          # stapler validate asks Apple's ticket service, so retry a dropped connection.
          for try in 1 2 3; do
            xcrun stapler validate /Applications/Moorings.app && break
            test "$try" -lt 3
            sleep 30
          done
          codesign -dv /Applications/Moorings.app 2>&1 | grep -q "TeamIdentifier=U7L4P2YHWJ"
          brew audit --cask --strict --online dcadolph/tap/moorings
          brew uninstall --cask moorings

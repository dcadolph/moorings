name: ci

# Run the core suite, then build the native app on macOS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5

      - name: Core tests
        run: swift test
        working-directory: core

      - name: Build
        run: swift build

      - name: Mac contracts
        run: swift test

      - name: Bundle with Shortcuts metadata
        run: make app ARCHS="arm64 x86_64"

name: ci

# Run every Lua suite on Lua 5.4, the version Hammerspoon embeds, and the moorings command's
# suite on macOS and Linux shells, and the native app's Swift suite on macOS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4

      - name: Test
        run: |
          status=0
          for t in tests/*_test.lua; do
            echo "== $t"
            lua5.4 "$t" || status=1
          done
          exit $status

  cli:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck -s sh moorings tests/cli_test.sh

      - name: Test
        run: sh tests/cli_test.sh

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: swift build

      - name: Test
        run: swift test

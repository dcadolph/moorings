name: ci

# Build the native app and run its Swift suite on macOS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: swift build

      - name: Test
        run: swift test

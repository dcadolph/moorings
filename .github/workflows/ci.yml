name: ci

# Lint on macos-26, which carries the Xcode that ships swift-format 6.3.0, then run the core suite
# and build the native app on macos-15, the release runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Lint with the swift-format 6.3.0 that formatted the tree, since another version may format
      # differently. DEVELOPER_DIR picks it, so the default Xcode of the image does not matter.
      - name: Format
        run: |
          set -euo pipefail
          for app in /Applications/Xcode*.app; do
            v="$(DEVELOPER_DIR="$app/Contents/Developer" xcrun swift-format --version 2>/dev/null || true)"
            echo "$app: ${v:-no swift-format}"
            if [ "$v" = 6.3.0 ]; then
              DEVELOPER_DIR="$app/Contents/Developer" xcrun swift-format lint --strict --recursive core mac windows
              exit 0
            fi
          done
          echo "no Xcode on this runner has swift-format 6.3.0"
          exit 1

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5

      - name: Core tests with coverage floors
        run: make coverage
        working-directory: core

      - name: Core tests under the thread sanitizer
        run: swift test --sanitize=thread -Xswiftc -warnings-as-errors
        working-directory: core

      - name: Core tests under the address sanitizer
        run: swift test --sanitize=address -Xswiftc -warnings-as-errors
        working-directory: core

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Probe
        run: make probe

      - name: Mac contracts
        run: swift test -Xswiftc -warnings-as-errors
        env:
          MOORINGS_LIVE_CONTRACTS: "1"

      - name: Bundle with Shortcuts metadata
        run: make app ARCHS="arm64 x86_64"
